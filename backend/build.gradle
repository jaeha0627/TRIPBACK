plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.2'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.tripback'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	testImplementation 'org.springframework.boot:spring-boot-starter-actuator-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-validation-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// Ordinary tests always abort live tests, even if credentials/opt-in environment flags exist.
// Keep the tests visible as SKIPPED with an explicit reason in the JUnit reports.
tasks.named('test') {
	useJUnitPlatform()
	systemProperty 'tripback.liveTests.allowed', 'false'
}

tasks.register('liveTest', Test) {
	group = 'verification'
	description = 'Explicitly opted-in Kakao live tests only; may make billable requests.'
	testClassesDirs = sourceSets.test.output.classesDirs
	classpath = sourceSets.test.runtimeClasspath
	useJUnitPlatform { includeTags 'live' }
	systemProperty 'tripback.liveTests.allowed', providers.gradleProperty('enableLiveTests').map { it == 'true' }.getOrElse(false).toString()
}
