" style=\"margin-top:10px\" data-a=\"open:trips\">내 여행 목록 보기<\/button>`}<\/div>`;\n}\nfunction sheetTrips(){\n  return `<div class=\"sh-head\"><h2>내 여행<\/h2><button class=\"x\" data-a=\"close\" aria-label=\"닫기\">✕<\/button><\/div>\n   ${S.history.length?`<div class=\"hist\">${S.history.map(h=>`<div class=\"trip\"><div class=\"th\"><div><b>${esc(h.region)} · ${WHO[h.form.who]||''}<\/b><div class=\"sub\">${h.date} · ${h.stops.length}곳 · 집 도착 ${h.homeAt}<\/div><\/div><span class=\"chip on\">여유 ${h.score}<\/span><\/div>\n   <div class=\"sub\" style=\"margin-top:6px\">${h.stops.map(s=>esc(s.name)).join(' → ')}<\/div>\n   <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn sm pri\" data-a=\"reuse:${h.id}\">그대로 다시 가기<\/button><button class=\"btn sm\" data-a=\"reuseCond:${h.id}\">조건만 가져오기<\/button><button class=\"btn sm ghost\" data-a=\"delTrip:${h.id}\">삭제<\/button><\/div><\/div>`).join('')}<\/div>`:'<p class=\"sub\">아직 저장된 여행이 없어요. 여행이 끝나면 자동으로 저장돼요.<\/p>'}`;\n}\nfunction sheetTrip(){\n  const h=S.history.find(x=>x.id===S.tripView);if(!h)return '';\n  const rows=h.stops.map(s=>`<li><span class=\"t\"><\/span><span class=\"d\"><\/span><span class=\"c\">${esc(s.name)}<small>${s.kind} · ${dur(s.stay)}<br>${esc(s.addr)}<\/small><\/span><\/li>`).join('');\n  return `<div class=\"sh-head\"><h2>${esc(h.region)} · ${h.date}<\/h2><button class=\"x\" data-a=\"close\" aria-label=\"닫기\">✕<\/button><\/div>\n   <p class=\"sub\">집 도착 ${h.homeAt} · 여유 지수 ${h.score}<\/p><div class=\"card\" style=\"margin-top:10px\"><ul class=\"tl\">${rows}<\/ul><\/div>\n   <div class=\"row\" style=\"margin-top:14px\"><button class=\"btn pri\" data-a=\"reuse:${h.id}\">그대로 다시 가기<\/button><button class=\"btn\" data-a=\"reuseCond:${h.id}\">조건만 가져오기<\/button><\/div>`;\n}\n\n/* ---- 일정 수정 ---- */\nfunction lo(){ // 수정 가능한 첫 인덱스\n  if(S.screen==='detail')return 0;\n  return Math.min(S.stops.length,S.idx+1);\n}\nfunction afterEdit(){\n  if(S.screen==='drive'||S.screen==='stay')checkPending();\n  render();renderSheet();toast('일정을 바꿨어요 · 귀가 예상 '+m2t(sched().home));\n}\nfunction candidates(cat){\n  const set=SETS[S.form.region],c=set.city;\n  const list={\n   '주유':[['바다로 주유소',6,10],['고속도로 휴게소 주유소',3,10]],\n   'LPG':[['국도변 LPG 충전소',8,10],['고속도로 LPG 충전소',4,10]],\n   '수소':[['수소충전소 (예약 권장)',15,20]],\n   '충전':[['해안 급속충전소 (150kW)',6,30],['휴게소 충전소 (100kW)',3,30]],\n   '휴게소':[['서해 휴게소',4,15],['언덕 졸음쉼터',2,10]],\n   '카페':[['포구 로스터리',5,35],['바다뷰 베이커리',8,40]],\n   '식당':[['시장 국밥집',5,50],['횟집 거리 식당',7,60]],\n   '편의점':[['포구 편의점',2,10]],\n   '관광지':[['등대 공원',9,50],['전망 케이블카',12,70]]\n  }[cat]||[];\n  return list.map((x,k)=>({k,name:x[0],detour:x[1],stay:x[2],kind:cat==='휴게소'?'휴식':(cat==='LPG'||cat==='수소'?'주유':cat)}));\n}\nfunction addStop(cat,k,pos,force){\n  const c=candidates(cat)[k];if(!c)return;\n  insertStop(c,pos,force);\n}\nfunction insertPoi(p,force){insertStop({kind:POIKIND[p.cat]||'경유',name:p.name,detour:p.km>25?12:8,stay:40,intro:POIINTRO[p.cat],addr:p.addr},force?S.idx:lo(),force)}\nfunction addCustom(name,force){\n  insertStop({kind:'경유',name,detour:8,stay:40,intro:'직접 넣으신 곳이에요'},force?S.idx:lo(),force);\n}\nfunction insertStop(c,pos,force){\n  pos=Math.max(force?S.idx:lo(),Math.min(S.stops.length,pos));\n  const stop=mkStop(c.kind,c.name,c.detour+5,c.stay,false,'직접 추가한 경유지',pos+7,S.form.region);\n  stop.user=true;if(c.intro)stop.intro=c.intro;if(c.addr){stop.addr=c.addr;stop.must=true}\n  const nxt=S.stops[pos];\n  if(nxt)nxt.travel+=Math.round(c.detour*.6);else S.homeTravel+=Math.round(c.detour*.6);\n  S.stops.splice(pos,0,stop);\n  if(S.screen==='drive'&&S.mode==='moving'&&pos===S.idx){ // 진행 중 목적지 앞에 추가 → 구간 재시작\n    S.leg={...S.leg,idx:S.idx,start:S.now,dur:stop.travel,base:stop.travel,extra:0,level:'원활',km:Math.round(stop.travel*KMPM)};\n    S.notes=[`목적지를 ${jo(stop.name,'으로','로')} 바꿨어요`];\n  }\n}\nfunction reply(text){S.reply={text,voice:speak(text)}}\nfunction replaceStop(i,name,why,intro,addr){\n  const s=S.stops[i],set=SETS[S.form.region];\n  s.name=name;s.user=true;s.find=false;s.must=true;s.opt=false;s.why=why;s.intro=intro||'직접 고르신 곳이에요';\n  s.addr=addr||`${set.city} ${set.road} ${200+i*13}번길 ${i*5+9}`;s.parking={...s.parking,name:name+' 주차장'};\n  if(S.screen==='drive'&&S.mode==='moving'&&i===S.idx)S.notes=[`목적지를 ${jo(name,'으로','로')} 바꿨어요`];\n}\nfunction voiceCmd(k){\n  const cat=svcCat();\n  const mvg=S.screen==='drive'&&S.mode==='moving';\n  if(k==='sms'){S.voice='도착 시각 가족에게 보내줘';sendSms();S.sheet=null;renderSheet();render();return}\n  if(k==='new'){S.voice='근처 다른 코스 추천해줘';reply('근처 코스를 두 가지 찾았어요. 화면에서 골라 주세요.');S.sheet='newc';renderSheet();render();return}\n  if(k==='gas'){S.voice=svcName()+' 들렀다 갈래';addStop(cat,0,mvg?S.idx:lo(),mvg);S.sheet=null}\n  else if(k==='rest'){S.voice='화장실 가고 싶어';addStop('휴게소',0,mvg?S.idx:lo(),mvg);S.sheet=null}\n  else if(k==='cafe'){S.voice='카페 빼줘';const i=futureOpt();if(i>=0){S.stops.splice(i,1)}else{toast('뺄 수 있는 선택 방문지가 없어요');return}}\n  else if(k==='named'){S.voice='딸기 체험 농장 들렀다 갈래';insertPoi(poiSearch('딸기')[0],mvg);S.sheet=null}\n  else if(k==='swap'){const i=S.stops.findIndex((x,j)=>j>=(mvg?S.idx:lo())&&x.kind==='점심');if(i<0){toast('바꿀 식당이 일정에 없어요');return}S.voice='점심은 예약해 둔 바다마을 횟집으로 바꿔줘';const pp=poiSearch('바다마을 횟집')[0];replaceStop(i,pp.name,'직접 정한 장소','예약해 두신 곳이라 점심 시간에 맞춰 두었어요',pp.addr);S.sheet=null}\n  S.adjusted=true;checkPending();reply(`말씀대로 바꿨어요. 집 도착 예상은 ${m2t(sched().home)}로 바뀌었어요.`);renderSheet();render();toast('말씀대로 바꿨어요 · 귀가 예상 '+m2t(sched().home));\n}\nfunction addService(){\n  const cat=svcCat();\n  const c=candidates(cat)[0];const pos=Math.min(2,S.stops.length);\n  const stop=mkStop(c.kind,c.name,c.detour+5,c.stay,false,S.form.vehicle==='ev'?'귀가 전 충전':'귀가 전 에너지 보충',pos+7,S.form.region);\n  const nxt=S.stops[pos];if(nxt)nxt.travel+=3;S.stops.splice(pos,0,stop);S.adjusted=true;render();toast(jo(stop.name,'을','를')+' 경유지에 넣었어요');\n}\nfunction addRest(){\n  const c=candidates('휴게소')[0];const half=Math.round(S.homeTravel/2);\n  const stop=mkStop('휴식',c.name,half,15,false,'2시간 이상 연속 운전을 피하기 위한 휴식',9,S.form.region);\n  S.homeTravel=S.homeTravel-half+5;S.stops.push(stop);S.adjusted=true;render();toast('귀가 길 중간에 휴게소를 넣었어요');\n}\n\n/* ================= views ================= */\nfunction phaseKey(){\n  if(['start','gen','choose','detail'].includes(S.screen))return -1;\n  if(S.screen==='summary')return 3;\n  if(S.screen==='stay')return 1;\n  return S.idx>=S.stops.length?2:0;\n}\nfunction energyChip(){\n  const v=S.form.vehicle;const started=!['start','gen','choose'].includes(S.screen);\n  const val=started&&S.stops.length?Math.max(0,Math.round(S.energy)):START[v];\n  return `<span class=\"chip ${val<RES[v]+5?'warn':''}\">${v==='ev'?'🔋':'⛽'} ${vehTxt()} ${val}%<\/span>`;\n}\nfunction renderTop(){\n  const k=phaseKey();\n  const onStart=S.screen==='start';\n  $('#tabs').innerHTML=onStart?[['home','새 여행'],['trips','내 여행'],['settings','설정']].map(([t,v])=>`<button role=\"tab\" aria-selected=\"${S.tab===t}\" data-a=\"tab:${t}\">${v}<\/button>`).join(''):'';\n  $('#phases').style.display=onStart?'none':'';\n  $('#bkBtn').disabled=(onStart&&S.tab==='home');\n  $('#phases').innerHTML=['가는 길','머무는 시간','오는 길'].map((n,i)=>\n    `<div class=\"ph ${k===i?'on':''} ${k>i?'done':''}\"><b>${i+1}단계<\/b>${n}<\/div>`).join('');\n  const started=['drive','stay','summary'].includes(S.screen);\n  const driving=S.screen==='drive'&&S.mode==='moving';\n  $('#carBar').innerHTML=(started?`<span class=\"chip ${driving?'on':''}\" id=\"stChip\">${driving?'● 주행 중':S.screen==='drive'?'● 도착 감지':'P 주차 중'}<\/span><span class=\"chip\" id=\"clock\">${m2t(S.now)}<\/span>`:'')+(started?aiChip():'')+energyChip();\n  try{parent.postMessage({tb:1,drive:driving,started,t:started?m2t(S.now):null},'*')}catch(e){}\n}\nconst bdg=s=>s.must?'<em class=\"bdg my\">내가 정한 곳<\/em>':'';\nfunction timeline(){\n  const {rows,home}=sched();\n  const inRun=['drive','stay'].includes(S.screen);\n  let html=`<li class=\"${S.screen==='drive'&&S.idx===0&&S.mode==='moving'&&false?'now':''}\"><span class=\"t\">${S.form.depart}<\/span><span class=\"d\"><\/span><span class=\"c\">출발<\/span><\/li>`;\n  rows.forEach((r,i)=>{\n    const here=S.screen==='stay'&&S.idx===i;\n    const heading=S.screen==='drive'&&S.idx===i;\n    const past=(inRun&&(i<S.idx||(S.screen==='drive'&&false)))||S.screen==='summary';\n    html+=`<li class=\"tl-drive\"><span class=\"t\"><\/span><span class=\"d\"><\/span><span class=\"c\">이동 ${dur(r.s.travel)}${r.s.traffic?'':''}<\/span><\/li>\n    <li class=\"${r.s.opt?'tl-opt':''} ${here||heading?'now':''} ${past?'past':''}\" data-a=\"place:${i}\" style=\"cursor:pointer\"><span class=\"t\">${m2t(r.arrive)}<\/span><span class=\"d\"><\/span><span class=\"c\">${esc(r.s.name)}${bdg(r.s)}<small>${r.s.kind} · ${dur(r.s.stay+r.s.delay)} 머무름${r.s.delay?` (대기 ${r.s.delay}분 포함)`:''}${r.s.user?' · 직접 추가':''}<\/small><small class=\"in\">${esc(r.s.intro||'')}<\/small><\/span><\/li>`;\n  });\n  html+=`<li class=\"tl-drive\"><span class=\"t\"><\/span><span class=\"d\"><\/span><span class=\"c\">집으로 ${dur(S.homeTravel)}<\/span><\/li>\n   <li class=\"tl-home ${S.screen==='drive'&&S.idx>=S.stops.length?'now':''}\"><span class=\"t\">${m2t(home)}<\/span><span class=\"d\"><\/span><span class=\"c\">집 도착 예상<small>희망 ${S.form.home} · 여유 ${HOME()-home}분<\/small><\/span><\/li>`;\n  return `<ul class=\"tl\">${html}<\/ul>`;\n}\nfunction sideHtml(){\n  if(!S.stops.length)return '';\n  return (S.screen==='drive'?sideDrive():'')+`<div class=\"card\" style=\"margin-top:${S.screen==='drive'?14:0}px\"><div class=\"pn\"><span>오늘의 일정 · ${S.planId==='full'?'알찬형':'여유형'}<\/span><button class=\"link\" data-a=\"open:edit\">일정 수정<\/button><\/div>${timeline()}<\/div>`;\n}\nconst MICSVG='<svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect x=\"9\" y=\"3\" width=\"6\" height=\"11\" rx=\"3\"/><path d=\"M5 11a7 7 0 0 0 14 0M12 18v3\"/><\/svg>';\n\nfunction chips(list,cur,act,multi){return `<div class=\"row\">${list.map(([k,v])=>`<button class=\"opt\" aria-pressed=\"${multi?cur.includes(k):String(cur)===String(k)}\" data-a=\"${act}${k}\">${v}<\/button>`).join('')}<\/div>`}\nfunction vStart(){\n  const f=S.form;\n  return `<div class=\"fade\">\n  <h1>오늘은 어디로<br>떠나볼까요?<\/h1>\n  <p class=\"sub\">가는 길, 머무는 시간, 돌아오는 길까지 하루 일정을 한 번에 짜 드려요.<\/p>\n\n  <div class=\"card hl\">\n    <h3>말로 알려주세요<\/h3>\n    <div class=\"say\">\n      <button class=\"mic ${S.listening?'live':''}\" data-a=\"mic\" aria-label=\"${S.listening?'듣는 중':'말하기'}\">${MICSVG}<\/button>\n      <textarea class=\"tinput\" id=\"sayText\" rows=\"2\" placeholder=\"${S.listening?'듣고 있어요…':'마이크를 누르고 말씀하세요. 예) 아이랑 체험하고 6시 반엔 집에 오고 싶어'}\">${esc(f.text)}<\/textarea>\n    <\/div>\n    <div class=\"row\" style=\"margin-top:12px\">\n      <button class=\"btn sm\" data-a=\"say\">입력한 말로 조건 채우기<\/button>\n      <button class=\"btn sm ghost\" data-a=\"example\">예시 넣기<\/button>\n    <\/div>\n    ${S.ai&&S.ai.length?`<div class=\"ai\"><span class=\"tag\">AI<\/span><div class=\"row\">${S.ai.map(x=>`<span class=\"mini\">${esc(x)}<\/span>`).join('')}<\/div><\/div>`:''}\n  <\/div>\n\n  <div class=\"lbl\">어디로 갈까요?<\/div>\n  ${chips(Object.keys(SETS).map(r=>[r,r]),f.region,'region:')}\n\n  <div class=\"lbl\">언제 출발해서 언제까지 돌아올까요?<\/div>\n  <div class=\"row\" style=\"gap:18px;align-items:center\">\n    <label class=\"time\">출발 <input type=\"time\" data-k=\"depart\" value=\"${f.depart}\"><\/label>\n    <label class=\"time\">귀가 <input type=\"time\" data-k=\"home\" value=\"${f.home}\"> 까지<\/label>\n  <\/div>\n  <div class=\"lbl\">안전 여유 시간 <small>· 귀가 시각보다 이만큼 먼저 도착하도록 지켜요<\/small><\/div>\n  ${chips([[15,'15분'],[30,'30분'],[45,'45분']],f.safe,'set:safe|')}\n\n  <div class=\"lbl\">누구와 가나요?<\/div>\n  ${chips(Object.entries(WHO),f.who,'who:')}\n  ${f.who==='family'?`<div class=\"lbl\">아이 연령 <small>· 일정과 휴식 길이에 반영해요<\/small><\/div>${chips(Object.entries(KID),f.kid,'kid:')}`:''}\n  ${f.who==='parents'?`<p class=\"sub\" style=\"margin-top:10px\">부모님과 함께라면 걷는 거리와 계단이 적은 곳을 우선해요.<\/p>`:''}\n\n  <div class=\"lbl\">하고 싶은 것 <small>· 여러 개 선택<\/small><\/div>\n  ${chips(Object.entries(INT),f.interests,'int:',true)}\n\n  <div class=\"lbl\">꼭 가고 싶은 곳이 있나요? <small>· 선택 · 정해 두신 식당이나 장소는 일정에 고정해 드려요<\/small><\/div>\n  ${f.must?`<div class=\"card info\" style=\"margin-top:0;display:flex;justify-content:space-between;gap:10px;align-items:center\"><div><b style=\"font-weight:500\">✓ ${esc(f.must)}<\/b><div class=\"sub\">${esc(f.mustAddr)}<\/div><\/div><button class=\"btn sm ghost\" data-a=\"mustClear\">바꾸기<\/button><\/div>`:psHtml('must','꼭 가고 싶은 곳 검색')}\n  <details class=\"more\" ${S.more?'open':''}>\n    <summary>더 자세한 조건 <span class=\"sub\" style=\"font-weight:400;margin-left:auto;margin-right:10px\">선택 사항<\/span><\/summary>\n    <div class=\"in\">\n      <div class=\"lbl\">이동 거리<\/div>\n      ${chips(Object.entries(DIST),f.dist,'set:dist|')}\n      <div class=\"lbl\">1인 예산 <small>· 식비·체험비 기준<\/small><\/div>\n      ${chips(Object.entries(BUDGET),f.budget,'set:budget|')}\n      <div class=\"lbl\">식사 취향 <small>· 여러 개 선택<\/small><\/div>\n      ${chips(Object.entries(MEALS),f.meals,'tog:meals|',true)}\n      <div class=\"lbl\">걷는 정도<\/div>\n      ${chips(Object.entries(WALK),f.walk,'set:walk|')}\n      <div class=\"lbl\">주차 조건<\/div>\n      ${chips(Object.entries(PARK),f.parking,'tog:parking|',true)}\n      <div class=\"lbl\">편의 시설·동반<\/div>\n      ${chips(Object.entries(AMEN),f.amen,'tog:amen|',true)}\n      <div class=\"lbl\">날씨 대응<\/div>\n      <div class=\"row\"><button class=\"opt\" aria-pressed=\"${f.rain}\" data-a=\"flag:rain\">비 오면 실내 위주로 바꿔 주세요<\/button><\/div>\n      <div class=\"lbl\">내 차 <small>· 차량과 연결되면 자동으로 인식해요<\/small><\/div>\n      ${chips(Object.entries(VEH),f.vehicle,'set:vehicle|')}\n      ${['lpg','fcev'].includes(f.vehicle)?'<p class=\"sub\" style=\"margin-top:8px\">LPG·수소 충전소는 수가 적어, 경로 근처 충전소를 미리 확인해 일정에 넣어 드려요.<\/p>':''}<div class=\"row\" style=\"margin-top:10px\"><button class=\"opt\" aria-pressed=\"${f.auto}\" data-a=\"flag:auto\">${needTxt()} 경유지에 자동으로 넣어 주세요<\/button><\/div>\n    <\/div>\n  <\/details>\n  <div class=\"actions\"><button class=\"btn pri\" data-a=\"generate\">AI로 일정 만들기<\/button><\/div>\n  <\/div>`;\n}\nfunction tripCard(h,full){\n  return `<div class=\"tcard\"><div class=\"th\" style=\"display:flex;justify-content:space-between;gap:8px\"><div><b style=\"font-weight:500\">${esc(h.region)} · ${WHO[h.form.who]||''}<\/b><div class=\"sub\">${h.date} · ${h.stops.length}곳 · 집 도착 ${h.homeAt}<\/div><\/div><span class=\"chip on\">여유 ${h.score}<\/span><\/div>\n   <div class=\"sub\" style=\"margin-top:6px\">${h.stops.map(s=>esc(s.name)).join(' → ')}<\/div>\n   <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn sm pri\" data-a=\"reuse:${h.id}\">그대로 다시 가기<\/button><button class=\"btn sm\" data-a=\"reuseCond:${h.id}\">조건만 가져오기<\/button>${full?`<button class=\"btn sm ghost\" data-a=\"openTrip:${h.id}\">자세히<\/button><button class=\"btn sm ghost\" data-a=\"delTrip:${h.id}\">삭제<\/button>`:''}<\/div><\/div>`;\n}\nfunction histSide(){\n  return `<div class=\"card\" style=\"margin-top:0\"><div class=\"pn\"><span>지난 여행<\/span><button class=\"link\" data-a=\"tab:trips\">전체 보기<\/button><\/div>\n   ${S.history.length?`<div class=\"hist\" style=\"margin-top:0\">${S.history.slice(0,3).map(h=>tripCard(h,false)).join('')}<\/div>`:'<p class=\"sub\">아직 저장된 여행이 없어요. 여행이 끝나면 자동으로 저장돼요.<\/p>'}<\/div>`;\n}\nfunction vTrips(){\n  return `<div class=\"fade\"><h1>내 여행<\/h1><p class=\"sub\">다녀온 여정을 그대로 다시 가거나, 조건만 가져와 새로 짤 수 있어요.<\/p>\n   <div class=\"hist\">${S.history.length?S.history.map(h=>tripCard(h,true)).join(''):'<p class=\"sub\">아직 저장된 여행이 없어요.<\/p>'}<\/div><\/div>`;\n}\nfunction vSettings(){\n  const f=S.form;\n  return `<div class=\"fade set\"><h1>설정<\/h1>\n   <div class=\"card\"><h3>가족 연락처 <small class=\"sub\" style=\"font-weight:400\">· 도착 시각 문자를 받을 1명<\/small><\/h3>\n    <div class=\"row\" style=\"margin-top:8px\"><input class=\"tinput\" id=\"famNum\" style=\"min-height:48px;max-width:260px\" value=\"${esc(S.set.family)}\" inputmode=\"tel\" aria-label=\"가족 전화번호\"><button class=\"btn sm\" data-a=\"saveFam\">저장<\/button><\/div>\n    <p class=\"sub\" style=\"margin-top:6px\">한 명만 등록돼요. 번호는 문자 발송에만 쓰고 최소로 보관해요.<\/p><\/div>\n   <div class=\"card\"><h3>기본 안전 여유 시간<\/h3><div style=\"margin-top:8px\">${chips([[15,'15분'],[30,'30분'],[45,'45분']],f.safe,'set:safe|')}<\/div><\/div>\n   <div class=\"card\"><h3>내 차<\/h3><div style=\"margin-top:8px\">${chips(Object.entries(VEH),f.vehicle,'set:vehicle|')}<\/div><\/div>\n   <div class=\"card\"><h3>AI 답변 방식<\/h3><div style=\"margin-top:8px\">${chips([['auto','자동 (주행 중 음성+화면, 정차 중 화면)'],['off','항상 화면만']],S.set.voice,'setvoice:')}<\/div><\/div><\/div>`;\n}\nfunction condChips(){\n  const f=S.form,a=[f.region,WHO[f.who]+(f.who==='family'?`(${KID[f.kid]})`:''),f.interests.map(k=>INT[k]).join('·'),`${f.home}까지 귀가`,`안전 여유 ${f.safe}분`,DIST[f.dist],VEH[f.vehicle]];\n  if(f.budget!=='any')a.push('예산 '+BUDGET[f.budget]);\n  if(f.walk!=='normal')a.push('걷기 '+WALK[f.walk]);\n  if(f.meals.length)a.push(f.meals.map(k=>MEALS[k]).join('·'));\n  f.parking.forEach(k=>a.push(PARK[k]));f.amen.forEach(k=>a.push(AMEN[k]));\n  if(f.rain)a.push('비 오면 실내');\n  return `<div class=\"conds\">${a.filter(Boolean).map(x=>`<span class=\"mini\">${esc(x)}<\/span>`).join('')}<\/div>`;\n}\nfunction vGen(){\n  const st=['조건을 정리하고 있어요','가볼 만한 곳을 고르고 있어요','귀가 시각과 에너지를 확인하고 있어요'];\n  return `<div class=\"gen fade\"><div class=\"spin\"><\/div><h2>일정을 짜는 중이에요<\/h2>\n  <p class=\"sub\">${esc(S.form.region)} · ${WHO[S.form.who]} · ${S.form.home}까지 귀가<\/p>\n  <div class=\"steps\">${st.map((t,i)=>`<div class=\"st ${S.genStep>i?'done':S.genStep===i?'on':''}\"><i>${S.genStep>i?'✓':i+1}<\/i>${t}<\/div>`).join('')}<\/div><\/div>`;\n}\nfunction planCard(id){\n  const stops=buildPlan(id);const sc=schedule(stops,DEPART(),DISTMAP[S.form.dist][1]);\n  const left=HOME()-sc.home;\n  const name=id==='full'?'알찬형':'여유형';\n  const why=left<0?'희망 귀가 시각을 넘어요. 장소를 줄이거나 귀가 시각을 늦춰야 해요.':id==='full'\n    ?'선택한 조건을 모두 담았어요. 여유는 적은 편이라 지연이 생기면 알려 드릴게요.'\n    :'꼭 가고 싶은 곳만 담아 시간 여유를 넉넉히 남겼어요.';\n  const rows=sc.rows.map(r=>`<li><span class=\"t\">${m2t(r.arrive)}<\/span><span class=\"d\"><\/span><span class=\"c\">${esc(r.s.name)}${bdg(r.s)}<small>${r.s.kind} · ${dur(r.s.stay)}<br>${esc(r.s.addr)}<br><span style=\"color:var(--teal)\">${esc(r.s.intro||'')}<\/span><\/small><\/span><\/li>`).join('');\n  return `<article class=\"plan\">\n   <div class=\"head\"><span class=\"name\">${name}<\/span><span class=\"chip ${left>=SAFE()?'on':'warn'}\">여유 ${left}분<\/span><\/div>\n   <ul class=\"tl\">${rows}<\/ul>\n   <div class=\"home\"><span>집 도착 예상<\/span><b>${m2t(sc.home)}<\/b><\/div>\n   <p class=\"why\">${why}<\/p>\n   <button class=\"btn pri block\" data-a=\"choose:${id}\">${name}으로 선택<\/button><\/article>`;\n}\nfunction vChoose(){\n  return `<div class=\"fade\"><h1>일정안 2가지를<br>만들었어요<\/h1>\n  <p class=\"sub\">AI가 만든 일정을 앱이 시간·귀가 기준으로 다시 확인했어요.<\/p>\n  ${condChips()}\n  <div class=\"plans\">${planCard('full')}${planCard('easy')}<\/div>\n  <div class=\"actions\"><button class=\"btn ghost\" data-a=\"restart\">조건 바꾸기<\/button><\/div><\/div>`;\n}\nfunction recs(){\n  let h='';\n  const end=predictEnd(),v=S.form.vehicle;\n  const chg=['lpg','fcev','ev'].includes(v);\n  if(end<RES[v]){\n    if(!S.dis.gas)h+=`<div class=\"ask\"><span class=\"asktag\">제안 · 선택해 주세요<\/span><h3>${chg?'충전':'주유'}소를 경유지에 넣을까요?<\/h3>\n    <p class=\"sub\">출발 ${vehTxt()} ${Math.round(S.energyStart)}% 기준, 귀가하면 약 ${Math.max(0,Math.round(end))}%만 남아요.<\/p>\n    <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn sm pri\" data-a=\"recGas\">${svcName()} 넣기<\/button><button class=\"btn sm ghost\" data-a=\"dismiss:gas\">안 넣을게요<\/button><\/div><\/div>`;\n  }else{\n    h+=`<div class=\"card info\"><div class=\"itag\">안내<\/div><h3>${v==='ev'?'🔋':'⛽'} 에너지 점검<\/h3><p class=\"sub\">출발 ${vehTxt()} ${Math.round(S.energyStart)}% · 귀가 시 약 ${Math.round(end)}% 예상 · ${chg?'충전':'주유'} 없이 다녀올 수 있어요.<\/p><\/div>`;\n  }\n  if(S.homeTravel>120&&!S.stops.some(s=>s.kind==='휴식')&&!S.dis.rest){\n    h+=`<div class=\"ask\"><span class=\"asktag\">제안 · 선택해 주세요<\/span><h3>귀가 길에 휴게소를 넣을까요?<\/h3><p class=\"sub\">귀가 길이 ${dur(S.homeTravel)}이에요. 2시간 넘게 쉬지 않고 운전하게 돼요.<\/p>\n    <div class=\"row\" style=\"margin-top:10px\"><button class=\"btn sm pri\" data-a=\"recRest\">휴게소 넣기<\/button><button class=\"btn sm ghost\" data-a=\"dismiss:rest\">안 넣을게요<\/button><\/div><\/div>`;\n  }\n  return h;\n}\nfunction vDetail(){\n  const sc=sched();const left=margin();\n  return `<div class=\"fade\"><h1>${S.planId==='full'?'알찬형':'여유형'} 일정<\/h1>\n  <p class=\"sub\">출발하면 첫 구간부터 내비게이션으로 안내해 드려요. 일정은 언제든 바꿀 수 있어요.<\/p>\n  <div class=\"card inline-plan\"><div class=\"pn\"><span>오늘의 일정<\/span><button class=\"link\" data-a=\"open:edit\">일정 수정<\/button><\/div>${timeline()}<\/div>\n  <div class=\"card info\"><div class=\"itag\">안내<\/div><h3>집 도착 예상 ${m2t(sc.home)}<\/h3>\n    <p class=\"sub\">희망 ${S.form.home}보다 ${left}분 일찍 도착해요. 안전 여유 ${SAFE()}분을 지키도록 지켜볼게요.<\/p><\/div>\n  ${recs()}\n  <div class=\"card info\"><div class=\"itag\">안내<\/div><h3>길이 바뀌어도 이어서 안내해요<\/h3>\n    <p class=\"sub\">시동을 껐다 켜도 오늘 일정은 그대로 이어지고, 다음 장소로 출발할 때마다 그때의 교통 상황으로 시간을 다시 계산해요.<\/p><\/div>\n  <div class=\"actions\"><button class=\"btn ghost\" data-a=\"toChoose\">다른 안 보기<\/button><button class=\"btn pri\" data-a=\"go\">출발하기<\/button><\/div><\/div>`;\n}\n\n/* ---- navigation drawing ---- */\nfunction legPts(i){\n  const r=n=>Math.sin(i*7.3+n*1.9)*.5+.5;const pts=[[24,206]];\n  for(let k=1;k<=5;k++)pts.push([24+k*64,206-k*30+(r(k)-.5)*46]);\n  pts.push([376,38]);return pts;\n}\nfunction ptAt(pts,p){\n  let L=0;const seg=[];for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d}\n  let t=Math.min(1,Math.max(0,p))*L;\n  for(let i=0;i<seg.length;i++){if(t<=seg[i]){const f=t/seg[i];return [pts[i][0]+(pts[i+1][0]-pts[i][0])*f,pts[i][1]+(pts[i+1][1]-pts[i][1])*f]}t-=seg[i]}\n  return pts[pts.length-1];\n}\nfunction mapSvg(p,idx){\n  const pts=legPts(idx);const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');\n  const c=ptAt(pts,p);const end=pts[pts.length-1];\n  return `<svg viewBox=\"0 0 400 240\" preserveAspectRatio=\"xMidYMid slice\" role=\"img\" aria-label=\"경로 지도\">\n   <rect width=\"400\" height=\"240\" fill=\"#eef2f5\"/>\n   <g stroke=\"#dfe5ea\" stroke-width=\"1\">${[40,80,120,160,200].map(y=>`<line x1=\"0\" y1=\"${y}\" x2=\"400\" y2=\"${y}\"/>`).join('')}${[60,120,180,240,300,360].map(x=>`<line x1=\"${x}\" y1=\"0\" x2=\"${x}\" y2=\"240\"/>`).join('')}<\/g>\n   <path d=\"M0 170 C90 150 140 190 230 160 S340 120 400 130\" fill=\"none\" stroke=\"#cfe3ee\" stroke-width=\"14\"/>\n   <path d=\"${d}\" fill=\"none\" stroke=\"#b9c3cc\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>\n   <path d=\"${d}\" pathLength=\"1\" fill=\"none\" stroke=\"#002c5f\" stroke-width=\"7\" stroke-linecap=\"round\" stroke-linejoin=\"round\" stroke-dasharray=\"${Math.min(1,p).toFixed(4)} 1\"/>\n   <circle cx=\"${pts[0][0]}\" cy=\"${pts[0][1]}\" r=\"6\" fill=\"#fff\" stroke=\"#002c5f\" stroke-width=\"3\"/>\n   <g transform=\"translate(${end[0]} ${end[1]})\"><path d=\"M0 0 C-12 -16 -12 -30 0 -30 C12 -30 12 -16 0 0Z\" fill=\"#007fa8\"/><circle cy=\"-21\" r=\"4.5\" fill=\"#fff\"/><\/g>\n   <circle cx=\"${c[0].toFixed(1)}\" cy=\"${c[1].toFixed(1)}\" r=\"11\" fill=\"#00aad2\" opacity=\".25\"/><circle cx=\"${c[0].toFixed(1)}\" cy=\"${c[1].toFixed(1)}\" r=\"6.5\" fill=\"#00aad2\" stroke=\"#fff\" stroke-width=\"2.5\"/>\n  <\/svg>`;\n}\nfunction maneuvers(toHome,name){\n  return [{f:.1,ic:'↱',t:'우회전',road:'진입로'},{f:.28,ic:'⇢',t:'고속도로 진입',road:toHome?'서해안고속도로 · 서울 방면':'서해안고속도로'},{f:.7,ic:'↗',t:'IC 출구',road:'○○IC 방면'},{f:.9,ic:'↰',t:'좌회전',road:S.stops[0]?SETS[S.form.region].road:'해안로'},{f:1,ic:'⚑',t:toHome?'집 도착':'목적지 도착',road:toHome?'안내 종료':name}];\n}\nfunction liveDrive(){\n  const L=S.leg,toHome=L.idx>=S.stops.length;\n  const p=Math.min(1,(S.now-L.start)/L.dur);\n  const mv=maneuvers(toHome,toHome?'집':S.stops[L.idx].name);\n  const cur=mv.find(m=>m.f>p)||mv[mv.length-1];const nxt=mv[mv.indexOf(cur)+1];\n  const km=L.km*(cur.f-p);const dist=km<1?Math.max(50,Math.round(km*1000/50)*50)+'m':km.toFixed(1)+'km';\n  const remMin=Math.max(0,(1-p)*L.dur),remKm=Math.max(0,(1-p)*L.km);\n  const eta=L.start+L.dur;const m=margin();\n  return `<div class=\"navcard\"><div class=\"ic\">${cur.ic}<\/div><div><div class=\"dist\">${S.mode==='arrived'?'도착':dist}<\/div><div class=\"road\">${S.mode==='arrived'?'목적지 부근입니다':esc(cur.t+' · '+cur.road)}<\/div>${nxt&&S.mode!=='arrived'?`<div class=\"nx\">그다음 ${esc(nxt.t)}<\/div>`:''}<\/div><button class=\"navq\" data-a=\"open:navq\">🔍 목적지 검색<\/button><div class=\"lim\" aria-label=\"제한속도 80\">80<\/div><\/div>\n  <div class=\"map\">${mapSvg(p,L.idx)}<\/div>\n  <div class=\"mapfoot\"><div><div class=\"k\">${toHome?'집 도착':'도착 예정'}<\/div><div class=\"v\">${m2t(eta)}<\/div><\/div><div><div class=\"k\">남은 시간<\/div><div class=\"v\">${dur(remMin)}<\/div><\/div><div><div class=\"k\">남은 거리<\/div><div class=\"v\">${remKm.toFixed(0)}km<\/div><\/div><div><div class=\"k\">집 도착 예상<\/div><div class=\"v ${m<SAFE()?'a':''}\">${m2t(sched().home)}<\/div><div class=\"s\">여유 ${m}분<\/div><\/div><div id=\"energyKpi\">${energyKpi()}<\/div><\/div>`;\n}\nfunction updateLive(){\n  const e=$('#live');if(e&&S.screen==='drive')e.innerHTML=liveDrive();\n  const sw=$('#sw');if(sw&&S.screen==='stay'){const st=S.stops[S.idx];const el=S.now-st.arriveAct;const tot=st.stay+st.delay;\n    sw.querySelector('.big').textContent=hms(el);\n    sw.querySelector('.pl').innerHTML=el<=tot?`예정 ${dur(tot)} · 남은 시간 <b>${dur(tot-el)}<\/b>`:`예정보다 <b style=\"color:var(--warn)\">${dur(el-tot)}<\/b> 지났어요`}\n  const c=$('#clock');if(c)c.textContent=m2t(S.now);const ac=$('#aiChip');if(ac){ac.textContent=aiMode()==='voice'?'🔊 AI 답변: 음성+화면':'🖥 AI 답변: 화면만';ac.classList.toggle('on',aiMode()==='voice')}\n  try{parent.postMessage({tb:1,drive:isDriving(),started:true,t:m2t(S.now)},'*')}catch(e){}\n  const dw=$('#dwell');if(dw&&S.mode==='arrived'){const d=Math.min(5,S.now-S.leg.arrivedAt);dw.innerHTML=`<i style=\"width:${d/5*100}%\"><\/i>`;const t=$('#dwellTxt');if(t)t.textContent=`${Math.ceil(5-d)}분 더 머무르면 자동으로 기록돼요`}\n  const eb=$('#carBar .chip:last-child');if(eb&&S.stops.length)eb.outerHTML=energyChip();\n  const ev=$('#energyKpi');if(ev)ev.innerHTML=energyKpi();\n}\nfunction energyKpi(){\n  const v=S.form.vehicle;const e=Math.max(0,Math.round(S.energy));\n  return `<div class=\"k\">${vehTxt()}<\/div><div class=\"v ${e<RES[v]+5?'a':''}\">${e}%<\/div><div class=\"s\">약 ${energyKm()}km 주행 가능<\/div>`;\n}\nfunction sugCard(driving){\n  if(!S.pending)return '';\n  const i=futureOpt();if(i<0)return '';\n  const st=S.stops[i],sc=sched(),h=HOME();\n  const keepHome=sc.home,dropHome=sc.home-(st.travel+st.stay),shortHome=sc.home-20;\n  return `<div class=\"card warn fade\"><h3>⚠ 귀가가 ${m2t(keepHome)}로 늦어질 수 있어요<\/h3>\n   <p class=\"sub\">희망 ${S.form.home}까지 안전 여유 ${SAFE()}분을 지키려면 조정이 필요해요. 가장 덜 중요한 ‘${esc(st.name)}’부터 줄이는 안이에요.<\/p>\n   <div class=\"sug\">\n     <button data-a=\"apply:drop\"><b>1안 · ${esc(st.kind)} 빼기<\/b><span>귀가 <em>${m2t(dropHome)}<\/em> · 여유 ${h-dropHome}분<\/span><\/button>\n     <button data-a=\"apply:short\"><b>2안 · ${esc(st.kind)} 20분 줄이기<\/b><span>귀가 <em>${m2t(shortHome)}<\/em> · 여유 ${h-shortHome}분<\/span><\/button>\n     <button data-a=\"keep\"><b>그대로 두기<\/b><span>귀가 ${m2t(keepHome)} · 여유 ${h-keepHome}분<\/span><\/button>\n   <\/div>\n   ${driving?`<p class=\"sub\" style=\"margin-top:10px\">운전 중에는 말로도 답할 수 있어요. “카페 빼줘”<\/p>`:''}<\/div>`;\n}\nfunction destCard(idx,label){\n  if(idx>=S.stops.length){return `<div class=\"card dest\"><div class=\"sub\">${label}<\/div><h2>집<\/h2><dl class=\"kv\"><dt>안내<\/dt><dd>집으로 가는 길 · 중간 휴식은 일정에 넣을 수 있어요<\/dd><\/dl><\/div>`}\n  const s=S.stops[idx],p=s.parking;\n  return `<div class=\"card dest\"><div class=\"sub\">${label}<\/div><h2>${esc(s.name)}${bdg(s)}<\/h2><p class=\"sub\">${s.kind} · ${dur(s.stay+s.delay)} 머무를 예정<\/p><p class=\"intro\">${esc(s.intro||'')}<\/p>\n   <dl class=\"kv\"><dt>주소<\/dt><dd>${esc(s.addr)}<\/dd><dt>주차<\/dt><dd><b>${esc(p.name)}<\/b> · ${esc(p.fee)}<\/dd><\/dl>\n   <div class=\"pk\"><b>주차장 안내<\/b> · 현재 ${esc(p.state)} · ${esc(p.walk)}<br>${esc(p.tip)}<\/div><\/div>`;\n}\nfunction demoBar(){\n  const b=(v,t)=>`<button class=\"opt sm\" aria-pressed=\"${S.speed===v}\" data-a=\"spd:${v}\">${t}<\/button>`;\n  return `<div class=\"demobar\"><span>시연 속도<\/span>${b(0,'⏸ 멈춤')}${b(1,'보통')}${b(5,'빠르게')}${b(20,'아주 빠르게')}<\/div>`;\n}\nfunction vDrive(){\n  const L=S.leg,toHome=L.idx>=S.stops.length,arrived=S.mode==='arrived';\n  return `<div class=\"live\" id=\"live\">${liveDrive()}<\/div>\n   ${arrived?`<div class=\"arr fade\"><b style=\"font-weight:500\">📍 ${toHome?'집 근처에 도착했어요':'목적지 근처에 도착했어요'}<\/b>\n     <div class=\"dwell\" id=\"dwell\"><i style=\"width:0\"><\/i><\/div><p class=\"sub\" id=\"dwellTxt\" style=\"margin:4px 0 8px\">5분 더 머무르면 자동으로 기록돼요<\/p>\n     <div class=\"row\"><button class=\"btn pri\" data-a=\"park\">${toHome?'집에 도착했어요':'도착했어요'}<\/button><button class=\"btn ghost\" data-a=\"keepMoving\">아직 이동 중이에요<\/button><\/div><\/div>`:''}\n   <div class=\"ctrl\"><button class=\"mic\" data-a=\"open:mic\" aria-label=\"말로 일정 바꾸기\">${MICSVG}<\/button><button class=\"btn sm\" data-a=\"open:edit\">일정 보기·수정<\/button><button class=\"btn sm ghost\" data-a=\"open:share\">가족에게 도착 시각 문자${S.share.sent?' ✓':''}<\/button><\/div>\n   <details class=\"tools\" ${S.toolsOpen?'open':''} ontoggle=\"S.toolsOpen=this.open\"><summary>시연 도구<\/summary>${demoBar()}<div class=\"row\"><button class=\"btn sm ghost\" data-a=\"skipLeg\" ${S.mode==='moving'?'':'disabled'}>이동 건너뛰기<\/button><button class=\"btn sm ghost\" data-a=\"skipDwell\" ${arrived?'':'disabled'}>5분 머무름 건너뛰기<\/button><\/div><\/details>`;\n}\nfunction sideDrive(){\n  const L=S.leg,toHome=L.idx>=S.stops.length;\n  const notes=S.notes.map(n=>{const slow=/서행|정체|지연/.test(n);return `<div class=\"traf ${slow?'slow':''}\"><span>🚦<\/span><span><b>${esc(n)}<\/b>${!toHome&&L.idx>0?'<br>시동을 껐다 켜도 오늘 일정은 유지되고, 출발할 때마다 교통을 다시 반영해요.':''}<\/span><\/div>`}).join('');\n  return sugCard(true)+bubbleHtml()+notes+destCard(L.idx,toHome?'오는 길 · 집으로':'가는 길 · 다음 목적지');\n}\nfunction vStay(){\n  const st=S.stops[S.idx],sc=sched(),m=margin();\n  const next=S.idx+1;const last=next>=S.stops.length;\n  const el=S.now-st.arriveAct,tot=st.stay+st.delay;\n  return `<div class=\"fade\">${demoBar()}<div class=\"chip on\" style=\"display:inline-block;margin-top:6px\">P ${m2t(st.arriveAct)} 도착 · ${st.autoArr?'5분 경과로 자동 기록':'도착 버튼으로 기록'}<\/div>\n   <h1 style=\"font-size:clamp(24px,5vw,34px)\">${esc(st.name)}<\/h1>\n   <p class=\"sub\">${st.kind} · ${esc(st.why)}<\/p><p class=\"intro\">${esc(st.intro||'')}<\/p>\n   <div class=\"sw\" id=\"sw\"><div class=\"k\">머문 시간<\/div><div class=\"big\">${hms(el)}<\/div>\n     <div class=\"pl\">${el<=tot?`예정 ${dur(tot)} · 남은 시간 <b>${dur(tot-el)}<\/b>`:`예정보다 <b style=\"color:var(--warn)\">${dur(el-tot)}<\/b> 지났어요`}<\/div>\n     <div class=\"stepper\"><button data-a=\"adj:-15\" aria-label=\"머무는 예정 시간 15분 줄이기\" style=\"width:auto;padding:0 14px;font-size:15px\">−15분<\/button><span class=\"sub\">머무는 예정 시간 ${dur(tot)}<\/span><button data-a=\"adj:15\" aria-label=\"머무는 예정 시간 15분 늘리기\" style=\"width:auto;padding:0 14px;font-size:15px\">+15분<\/button><\/div><\/div>\n   ${S.notes.map(n=>`<div class=\"traf slow\"><span>⏱<\/span><span><b>${esc(n)}<\/b><\/span><\/div>`).join('')}\n   ${sugCard(false)}${bubbleHtml()}\n   ${!S.pending?`<div class=\"card\"><h3>집 도착 예상 ${m2t(sc.home)}<\/h3><p class=\"sub\">희망 ${S.form.home} · 여유 ${m}분 ${m>=SAFE()?'· 안전해요':''}<\/p><\/div>`:''}\n   ${S.ign?`<div class=\"card hl\"><h3>🚗 시동이 켜졌어요<\/h3><p class=\"sub\">출발 버튼을 누르면 다음 구간을 안내해요. 누르지 않아도 차가 100m 이상 움직이면 자동으로 출발 처리해요.<\/p><div style=\"margin-top:12px\"><button class=\"btn pri go\" data-a=\"depart:btn\">출발<\/button><\/div><\/div>`:`<div class=\"auto\"><span>🚗<\/span><span><b>시동을 걸면 ‘출발’ 버튼이 나타나요.<\/b><br>누르지 않아도 차가 100m 이상 움직이면 자동으로 출발 처리해요.<\/span><\/div>`}\n   ${destCard(next,last?'다음 · 집으로':'다음 목적지')}\n   <div class=\"row\" style=\"margin-top:12px\"><button class=\"btn sm\" data-a=\"open:edit\">일정 수정 · 경유지 추가<\/button><button class=\"btn sm ghost\" data-a=\"open:share\">가족에게 도착 시각 문자${S.share.sent?' ✓':''}<\/button><\/div>\n   <div class=\"card inline-plan\">${timeline()}<\/div>\n   <div class=\"demo\"><p>시연 도구 · 실제 차량에서는 시동 상태로 자동 처리돼요<\/p><div class=\"row\"><button class=\"btn sm ghost\" data-a=\"skipStay\">예정 시간까지 건너뛰기<\/button><button class=\"btn sm ghost\" data-a=\"ignite\" ${S.ign?'disabled':''}>시동 걸기<\/button><button class=\"btn sm ghost\" data-a=\"depart:auto\" ${S.ign?'':'disabled'}>100m 이동 (자동 출발)<\/button><\/div><\/div>\n   <\/div>`;\n}\nfunction scoreCalc(){\n  const m=margin(),s=SAFE();\n  const a=Math.round(40*Math.max(0,Math.min(1,m/s)));\n  const b=S.adjusted||!S.delayDone?30:12;\n  const c=S.maxLeg<=120?30:15;\n  return {a,b,c,total:a+b+c};\n}\nfunction vSummary(){\n  const sc=sched();const done=m2t(sc.home);const m=margin();\n  const stay=S.stops.reduce((x,s)=>x+s.stay+s.delay,0);\n  const sc2=scoreCalc();\n  return `<div class=\"fade\"><h1>오늘의 여정을<br>기록했어요<\/h1>\n  <p class=\"sub\">집에 ${done}에 도착했어요. 희망 ${S.form.home}보다 ${Math.abs(m)}분 ${m>=0?\"일찍\":\"늦게\"} 돌아왔어요.<\/p>\n  <div class=\"stats\"><div class=\"stat\"><b>${S.stops.length}곳<\/b><span>방문<\/span><\/div><div class=\"stat\"><b>${dur(stay)}<\/b><span>머문 시간<\/span><\/div><div class=\"stat\"><b>${Math.max(0,Math.round(S.energy))}%<\/b><span>남은 ${vehTxt()}<\/span><\/div><\/div>\n  <div class=\"card\"><h3>오늘의 여유 지수<\/h3>\n    <div class=\"score\"><div class=\"n\">${sc2.total}<\/div><p class=\"sub\">일정을 얼마나 여유 있게 지켰는지만 봐요.<br>급가속·과속 같은 운전 습관은 평가하지 않아요.<\/p><\/div>\n    <div class=\"sbar\"><span>귀가 여유 유지<\/span><span>${sc2.a}/40<\/span><\/div><i style=\"display:block;height:4px;background:var(--teal);width:${sc2.a/40*100}%\"><\/i>\n    <div class=\"sbar\"><span>지연에 대응<\/span><span>${sc2.b}/30<\/span><\/div><i style=\"display:block;height:4px;background:var(--teal);width:${sc2.b/30*100}%\"><\/i>\n    <div class=\"sbar\"><span>연속 운전 ${S.maxLeg<=120?'2시간 이내':'휴식 권장'}<\/span><span>${sc2.c}/30<\/span><\/div><i style=\"display:block;height:4px;background:var(--teal);width:${sc2.c/30*100}%\"><\/i>\n  <\/div>\n  <div class=\"card\"><div class=\"pn\">오늘의 경로<\/div>${timeline()}<\/div>\n  <div class=\"card hl\"><h3>다음 여행에 다시 쓰기<\/h3><p class=\"sub\">오늘 다녀온 코스와 머문 시간이 저장되어, 다음에는 더 빠르게 일정을 만들 수 있어요.<\/p><\/div>\n  <div class=\"actions\"><button class=\"btn ghost\" data-a=\"open:share\">가족에게 알리기<\/button><button class=\"btn pri\" data-a=\"restart\">새 여행 계획하기<\/button><\/div><\/div>`;\n}\n\n/* ================= sheets ================= */\nconst GRIP='<svg viewBox=\"0 0 16 22\" aria-hidden=\"true\"><g fill=\"currentColor\"><circle cx=\"4\" cy=\"4\" r=\"2\"/><circle cx=\"12\" cy=\"4\" r=\"2\"/><circle cx=\"4\" cy=\"11\" r=\"2\"/><circle cx=\"12\" cy=\"11\" r=\"2\"/><circle cx=\"4\" cy=\"18\" r=\"2\"/><circle cx=\"12\" cy=\"18\" r=\"2\"/><\/g><\/svg>';\nfunction sheetEdit(){\n  const l=lo();\n  const moving=S.screen==='drive'&&S.mode==='moving';\n  if(moving)return `<div class=\"sh-head\"><h2>일정 수정<\/h2><button class=\"x\" data-a=\"close\" aria-label=\"닫기\">✕<\/button><\/div>\n   <p class=\"sub\">운전 중에는 화면 대신 말로 바꿔요.<\/p>${voiceList()}`;\n  const rows=S.stops.map((s,i)=>{\n    const lock=i<l;\n    return `<div class=\"erow ${lock?'lock':''}\" data-row=\"${i}\">${lock?'<span style=\"width:40px;flex:none\"><\/span>':`<span class=\"grip\" data-i=\"${i}\" role=\"button\" aria-label=\"길게 눌러 순서 바꾸기\">${GRIP}<\/span>`}\n     <div class=\"nm\">${esc(s.name)}${bdg(s)}<small>${s.kind} · 머무는 시간 ${dur(s.stay+s.delay)}${lock?' · 지나간 일정':''}<\/small><\/div>\n     ${lock?'':`<div class=\"stp\"><button data-a=\"sst:${i}|-15\" aria-label=\"머무는 시간 15분 줄이기\">−15분<\/button><button data-a=\"sst:${i}|15\" aria-label=\"머무는 시간 15분 늘리기\">+15분<\/button><\/div>\n     <button class=\"opt sm\" data-a=\"swap:${i}\" style=\"min-height:40px\">다른 곳으로<\/button><button class=\"opt sm\" data-a=\"rm:${i}\" style=\"min-height:40px\">삭제<\/button>`}<\/div>`}).join('');\n  const cats=[svcCat(),'휴게소','카페','식당','편의점','관광지'];\n  const posOpts=[];for(let p=l;p<=S.stops.length;p++)posOpts.push(`<option value=\"${p}\">${p===S.stops.length?'마지막 (집 가기 전)':esc(S.stops[p].name)+' 앞'}<\/option>`);\n  return `<div class=\"sh-head\"><h2>일정 수정<\/h2><button class=\"x\" data-a=\"close\" aria-label=\"닫기\">✕<\/button><\/div>\n   <p class=\"sub\">${S.screen==='drive'?'도착 감지 중이에요. ':''}왼쪽 ⠿ 을 길게 누른 채 위아래로 끌면 순서가 바뀌어요. <b>−15분 / +15분<\/b>은 그 장소에서 머무는 시간을 줄이거나 늘려요.<\/p>\n   <div style=\"margin-top:10px\">${rows}<\/div>\n   ${S.swapIdx!=null&&S.stops[S.swapIdx]?swapPanel():''}\n   <p class=\"lbl\">새 코스 추천<\/p>\n   <div class=\"row\"><button class=\"btn sm\" data-a=\"open:newc\">지금 위치에서 새 코스 추천받기<\/button><\/div>\n   <p class=\"lbl\">가고 싶은 곳 넣기<\/p>\n   <label class=\"time\" style=\"margin-bottom:8px\">넣을 위치 <select class=\"sel\" id=\"addPos\">${posOpts.join('')}<\/select><\/label>\n   ${psHtml('add','가고 싶은 곳 검색')}\n   <p class=\"lbl\">자주 넣는 경유지<\/p>\n   <div class=\"row\">${cats.map(c=>`<button class=\"opt sm\" aria-pressed=\"${S.editCat===c}\" data-a=\"cat:${c}\">${c}<\/button>`).join('')}<\/div>\n   ${S.editCat?`<div style=\"margin-top:12px\">${candidates(S.editCat).map(c=>`<div class=\"cand\"><div><b style=\"font-weight:500\">${esc(c.name)}<\/b><small>경로에서 약 ${c.detour}분 · ${dur(c.stay)} 머무름<\/small><\/div><button class=\"btn sm pri\" data-a=\"addc:${S.editCat}|${c.k}\">추가<\/button><\/div>`).join('')}<\/div>`:''}\n   <div style=\"margin-top:14px;font-size:13px;color:var(--utility)\">귀가 예상 <b style=\"color:var(--navy)\">${m2t(sched().home)}<\/b> · 여유 ${margin()}분<\/div>\n   <div class=\"row\" style=\"margin-top:14px\"><button class=\"btn pri block\" data-a=\"close\">완료<\/button><\/div>`;\n}\nfunction voiceList(){\n  const cat=svcName();\n  const b=(k,q,d)=>`<button class=\"voice-sim\" data-a=\"voice:${k}\"><b>“${q}”<\/b><span>${d}<\/span><\/button>`;\n  return `<div class=\"sug\" style=\"margin-top:12px\">\n   ${b('gas',cat+' 들렀다 갈래','가까운 '+cat+'를 바로 다음 경유지로 넣어요')}\n   ${b('rest','화장실 가고 싶어','가까운 휴게소를 다음 경유지로 넣어요')}\n   ${b('new','근처 다른 코스 추천해줘','지금 위치에서 새 코스를 제안해요')}\n   ${b('named','딸기 체험 농장 들렀다 갈래','말한 장소를 일정에 끼워 넣어요')}\n   ${b('swap','점심은 예약해 둔 바다마을 횟집으로 바꿔줘','정해 둔 곳으로 방문지를 교체해요')}\n   ${b('cafe','카페 빼줘','남은 선택 방문지를 일정에서 빼요')}\n   ${b('sms','도착 시각 가족에게 보내줘','등록된 가족 1명에게 문자를 보내요')}<\/div>\n   <p class=\"sub\" style=\"margin-top:12px\">실제 차량에서는 마이크로 말하면 AI가 의도를 이해해 위 명령으로 바꾸고, 주행 중에는 음성과 화면으로 함께 답해요.<\/p>`;\n}\nfunction swapCat(k){return {'점심':'식당','카페':'카페','휴식':'휴게소','충전':'충전','주유':'주유'}[k]||'관광지'}\nfunction swapPanel(){\n  const i=S.swapIdx,s=S.stops[i],al=candidates(swapCat(s.kind));\n  return `<div class=\"swp\"><div style=\"display:flex;justify-content:space-between;align-items:center\"><b style=\"font-weight:500\">‘${esc(s.name)}’ 대신 갈 곳<\/b><button class=\"link\" data-a=\"swapCancel\">취소<\/button><\/div>\n   <div style=\"margin-top:8px\">${psHtml('swap','대신 갈 곳 검색')}<\/div>\n   <p class=\"sub\" style=\"margin-top:10px\">추천<\/p>\n   ${al.map(c=>`<div class=\"cand\"><div><b style=\"font-weight:500\">${esc(c.name)}<\/b><small>경로에서 약 ${c.detour}분 · ${dur(c.stay)} 머무름<\/small><\/div><button class=\"btn sm\" data-a=\"swapTo:${c.k}\">이 곳으로<\/button><\/div>`).join('')}<\/div>`;\n}\nfunction sheetNewc(){\n  const cs=courses();\n  return `<div class=\"sh-head\"><button class=\"back\" data-a=\"open:edit\" style=\"min-height:44px\">‹ 일정 수정으로 돌아가기<\/button><button class=\"x\" data-a=\"close\" aria-label=\"닫기\">✕<\/button><\/div><h2>지금 위치에서 새 코스<\/h2>\n   <p class=\"sub\">남은 선택 방문지를 아래 코스로 바꿔요. 꼭 가는 곳과 이미 다녀온 곳은 그대로예요.<\/p>\n   ${cs.map((c,k)=>{const h=schedule(courseList(c),DEPART(),S.homeTravel).home;const st=courseStops(c);return `<div class=\"card\"><b style=\"font-weight:500\">${k+1}안 · ${c.name}<\/b>\n    <ul style=\"margin:8px 0;padding-left:18px\">${st.map(x=>`<li>${esc(x.name)} <span class=\"sub\">· ${dur(x.stay)}<br>${esc(x.intro)}<\/span><\/li>`).join('')}<\/ul>\n    <p class=\"sub\">집 도착 예상 <b style=\"color:var(--navy)\">${m2t(h)}<\/b> · 여유 ${Math.round(HOME()-h)}분<\/p>\n    <button class=\"btn pri sm\" style=\"margin-top:8px\" data-a=\"applyc:${k}\">이 코스로 바꾸기<\/button><\/div>`}).join('')}`;\n}\nfunction sheetMic(){\n  return `<div class=\"sh-head\"><h2>말로 일정 바꾸기<\/h2><button class=\"x\" data-a=\"close\" aria-label=\"닫기\">✕<\/button><\/div>\n   <div style=\"text-align:center;padding:6px 0\"><div class=\"mic lg live\" style=\"margin:0 auto\">${MICSVG}<\/div><p class=\"sub\" style=\"margin-top:12px\">듣고 있어요. 아래 말 중 하나를 눌러 시연해 보세요.<\/p><\/div>${voiceList()}`;\n}\nfunction sheetShare(){\n  const eta=m2t(sched().home),sh=S.share;const changed=sh.sent&&sh.eta!==eta;\n  return `<div class=\"sh-head\"><h2>가족에게 도착 시각 문자<\/h2><button class=\"x\" data-a=\"close\" aria-label=\"닫기\">✕<\/button><\/div>\n   <p class=\"sub\">미리 등록한 가족 1명에게 문자로 보내요. 운전 중에도 말로 보낼 수 있고, 일정이 바뀌면 다시 보낼 수 있어요.<\/p>\n   <div class=\"fam\"><div class=\"row\" style=\"justify-content:space-between\"><span><b style=\"font-weight:500\">받는 사람<\/b> · ${esc(S.set.famName)}<\/span><span class=\"sub\">${esc(S.set.family.replace(/(\\d{3})-?(\\d{3,4})-?(\\d{4})/,'$1-****-$3'))}<\/span><\/div>\n    <p class=\"sub\" style=\"margin-top:4px\">가족 번호는 설정에서 1명만 등록해 둬요. <button class=\"link\" data-a=\"tab:settings\">설정 열기<\/button><\/p><\/div>\n   <p class=\"lbl\">보낼 문자 미리보기<\/p><div class=\"sms\">${esc(smsText())}<\/div>\n   <ul class=\"sub\" style=\"margin:12px 0 0;padding-left:18px\"><li>정확한 위치는 보내지 않고 도착 예상 시각만 보내요.<\/li><li>번호는 문자 발송에만 쓰고 최소로 보관해요.<\/li><\/ul>\n   ${sh.sent?`<p class=\"sub\" style=\"margin-top:12px;color:${changed?'var(--warn)':'var(--teal)'}\">${changed?'보낸 시각('+sh.eta+')과 지금 예상('+eta+')이 달라졌어요. 다시 보낼 수 있어요.':'✓ '+sh.at+'에 보냈어요 · 도착 예상 '+sh.eta}<\/p>`:''}\n   <div class=\"row\" style=\"margin-top:16px\"><button class=\"btn pri block\" data-a=\"send\">${sh.sent?'다시 보내기':'문자 보내기'}<\/button><\/div>`;\n}\nfunction sheetPlace(){\n  const i=S.placeIdx,s=S.stops[i];if(!s)return '';const p=s.parking,can=i>=lo()&&!isDriving();\n  return `<div class=\"sh-head\"><h2>${esc(s.name)}${bdg(s)}<\/h2><button class=\"x\" data-a=\"close\" aria-label=\"닫기\">✕<\/button><\/div>\n   <p class=\"sub\">${s.kind} · ${dur(s.stay+s.delay)} 머무를 예정<\/p><p class=\"intro\">${esc(s.intro||'')}<\/p>\n   <dl class=\"kv\"><dt>주소<\/dt><dd>${esc(s.addr)}<\/dd><dt>주차<\/dt><dd><b>${esc(p.name)}<\/b> · ${esc(p.fee)}<\/dd><dt>운영시간<\/dt><dd>확인 필요 <span class=\"sub\">(공식 정보를 확인하면 표시돼요)<\/span><\/dd><\/dl>\n   <div class=\"pk\"><b>주차장 안내<\/b> · 현재 ${esc(p.state)} · ${esc(p.walk)}<br>${esc(p.tip)}<\/div>\n   <div class=\"row\" style=\"margin-top:14px\">${can?`<button class=\"btn pri\" data-a=\"swap2:${i}\">다른 곳으로 교체<\/button><button class=\"btn\" data-a=\"rm2:${i}\">일정에서 빼기<\/button>`:''}<button class=\"btn ghost\" data-a=\"close\">닫기<\/button><\/div>`;\n}\nfunction sheetLeave(){\n  return `<div class=\"sh-head\"><h2>여행을 그만둘까요?<\/h2><button class=\"x\" data-a=\"close\" aria-label=\"닫기\">✕<\/button><\/div>\n   <p class=\"sub\">지금 진행 중인 여행이 있어요. 종료하면 이번 여행은 ‘내 여행’에 저장되지 않아요.<\/p>\n   <div class=\"row\" style=\"margin-top:16px\"><button class=\"btn pri\" data-a=\"close\">계속 이어서 하기<\/button><button class=\"btn\" data-a=\"leaveGo\">종료하고 홈으로<\/button><\/div>`;\n}\nfunction sheetNavq(){\n  return `<div class=\"sh-head\"><h2>목적지·경유지 검색<\/h2><button class=\"x\" data-a=\"close\" aria-label=\"닫기\">✕<\/button><\/div>\n   <p class=\"sub\">찾은 장소를 다음 경유지로 넣고 바로 길안내를 이어가요.<\/p>${psHtml('navq','장소·주소 검색')}`;\n}\nfunction renderSheet(){\n  const w=$('#ovwrap');\n  if(!S.sheet){w.innerHTML='';return}\n  const body={edit:sheetEdit,mic:sheetMic,share:sheetShare,trips:sheetTrips,trip:sheetTrip,newc:sheetNewc,place:sheetPlace,leave:sheetLeave,navq:sheetNavq}[S.sheet]();\n  w.innerHTML=`<div class=\"ov\" onclick=\"if(event.target===this)A.close()\"><div class=\"sheet fade\" role=\"dialog\" aria-modal=\"true\">${body}<\/div><\/div>`;\n}\n\n/* ================= render ================= */\nfunction render(){\n  const scr=S.screen;\n  const view=scr==='start'?(S.tab==='trips'?vTrips:S.tab==='settings'?vSettings:vStart):{gen:vGen,choose:vChoose,detail:vDetail,drive:vDrive,stay:vStay,summary:vSummary}[scr];\n  $('#main').innerHTML=view();\n  const home=scr==='start'&&S.tab==='home';\n  const solo=['gen','choose'].includes(scr)||(scr==='start'&&!home);\n  $('#body').classList.toggle('solo',solo);\n  $('#body').classList.toggle('nav',scr==='drive');\n  $('#side').innerHTML=home?histSide():(solo||scr==='start')?'':sideHtml();\n  renderTop();\n  if(S.sheet)renderSheet();\n}\nS.history=loadHist()||[];if(!S.history.length)S.history=seedTrips();else S.history=S.history.concat(seedTrips()).slice(0,20);\nrender();\n<\/script>\n<\/body>\n<\/html>\n";
const MODES={full:{w:1280,h:720,info:{x:0,y:0,w:200,h:720,k:'col'},bar:{x:0,y:0,w:0,h:0},wins:[{x:200,y:0,w:1080,h:720,app:true}],t:'가로 16:9 (2560×1440 기준 1280×720dp) · 앱 창 전체 1080×720dp'}};
let mode='full',st={drive:false,t:null};
const $=s=>document.querySelector(s);
const clock=()=>{const d=new Date();return String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')};
function otherApp(w,h){
  const lines=[0,1,2,3,4,5].map(i=>`<line x1="0" y1="${(i+1)*h/7}" x2="${w}" y2="${(i+1)*h/7}" stroke="#1d2a33"/>`).join('')+[0,1,2,3].map(i=>`<line y1="0" x1="${(i+1)*w/5}" y2="${h}" x2="${(i+1)*w/5}" stroke="#1d2a33"/>`).join('');
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid slice"><rect width="${w}" height="${h}" fill="#10161b"/>${lines}<path d="M0 ${h*.7} C${w*.3} ${h*.5} ${w*.5} ${h*.8} ${w} ${h*.4}" stroke="#2a8aa8" stroke-width="10" fill="none" opacity=".6"/><circle cx="${w*.45}" cy="${h*.62}" r="9" fill="#00aad2"/></svg><div class="lb">다른 앱 창 (지도·미디어 등)</div>`;
}
function box(el,x,y,w,h){el.style.cssText='left:'+x+'px;top:'+y+'px;width:'+w+'px;height:'+h+'px'}
function build(){
  const stage=$('#stage');
  stage.innerHTML='<div class="info" id="info"></div><div class="other" id="other"></div><div class="win" id="win"><iframe id="appf" title="Tripback 앱 창"></iframe></div>';
  $('#appf').srcdoc=APP;
}
function render(){
  const m=MODES[mode],stage=$('#stage');
  stage.style.width=m.w+'px';stage.style.height=m.h+'px';
  const i=m.info,info=$('#info');
  box(info,i.x,i.y,i.w,i.h);info.classList.toggle('row',i.k==='row');
  info.innerHTML='<span class="gear"></span><div class="spd">0<small> km/h</small></div><div class="clk"></div><div class="sub">외기 17°C</div>'+(i.k==='col'?'<div class="sub">주행 정보 영역</div>':'');
  const app=m.wins.find(w=>w.app),oth=m.wins.find(w=>!w.app);
  box($('#win'),app.x,app.y,app.w,app.h);
  const o=$('#other');
  if(oth){box(o,oth.x,oth.y,oth.w,oth.h);o.innerHTML=otherApp(oth.w,oth.h);o.style.display='block'}else{o.style.display='none'}
  upd();
  $('#note').textContent=m.t+' · 공식 문서에는 해상도 수치가 없어 Devbox(17인치 2560×1440) 기준으로 가정한 값입니다.';
  fit();
}
function fit(){
  const m=MODES[mode],wrap=$('#wrap');
  const sc=Math.min((wrap.clientWidth-24)/(m.w+20),(wrap.clientHeight-24)/(m.h+20),1.4);
  $('#stage').style.transform='scale('+sc+')';
  const sz=$('#scaler');sz.style.width=(m.w+20)*sc+'px';sz.style.height=(m.h+20)*sc+'px';
}
function upd(){
  const g=$('.info .gear');if(!g)return;
  g.textContent=st.drive?'D':'P';
  const sp=$('.info .spd');if(sp)sp.firstChild.nodeValue=st.drive?'78':'0';
  const c=$('.info .clk');if(c)c.textContent=st.t||clock();
}
build();
addEventListener('message',e=>{const d=e.data;if(d&&d.tb){st={drive:!!d.drive,t:d.t};upd()}});
addEventListener('resize',fit);
render();
</script>
</body>
</html>
