<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tripback · 차량 화면 시안</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:#0e1114;color:#e8edf1;font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;letter-spacing:-.3px;display:flex;flex-direction:column;overflow:hidden}
.tool{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid #222a31;font-size:13px}
.tool b{font-weight:500;font-size:15px;margin-right:6px}
.seg{display:flex;gap:0;border:1px solid #3a4651}
.seg button{background:none;border:0;color:#c9d3da;padding:8px 14px;font:inherit;cursor:pointer;min-height:36px}
.seg button[aria-pressed=true]{background:#00aad2;color:#00212b;font-weight:600}
.seg button:focus-visible{outline:2px solid #fff;outline-offset:-2px}
.note{color:#8d9aa5;font-size:12px;flex:1;min-width:240px}
.wrap{flex:1;display:grid;place-items:center;min-height:0;padding:12px}
.scaler{position:relative}
.stage{box-sizing:content-box;position:absolute;left:0;top:0;transform-origin:0 0;background:#000;border-radius:34px;border:10px solid #1b2128;box-shadow:0 0 0 2px #2c353d,0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.info{position:absolute;background:#1c1b1b;color:#fff;padding:22px 18px}
.info .gear{display:inline-block;min-width:38px;text-align:center;padding:2px 8px;border:2px solid #00aad2;color:#00aad2;font-weight:600;font-size:18px}
.info .spd{font-size:64px;line-height:1;font-weight:300;margin-top:14px}
.info .spd small{font-size:16px;color:#9aa7b1;margin-left:4px}
.info .clk{font-size:22px;margin-top:18px}
.info .sub{font-size:13px;color:#9aa7b1;margin-top:6px}
.info.row{display:flex;align-items:center;gap:22px;padding:0 22px}
.info.row .spd{font-size:34px;margin:0}.info.row .clk{margin:0;font-size:20px}.info.row .sub{margin:0}
.bar{position:absolute;background:#141414;display:flex;align-items:center;justify-content:space-around;color:#cfd8de;font-size:12px}
.bar span{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 14px}
.bar i{font-style:normal;font-size:22px}
.bar .on{color:#00aad2}
.win{position:absolute;background:#fff;overflow:hidden}
.other{display:none}
.win iframe{border:0;width:100%;height:100%;display:block;background:#fff}
.other{position:absolute;background:#10161b;color:#9fb1bd;overflow:hidden}
.other svg{width:100%;height:100%}
.other .lb{position:absolute;left:14px;top:12px;font-size:13px;color:#cfe3ee}
.dim{position:absolute;left:0;bottom:-26px;font-size:12px;color:#6f7c87}
</style>
</head>
<body>
<div class="tool"><b>Tripback · 차량 화면 시안</b><span class="note" id="note"></span></div>
<div class="wrap" id="wrap"><div class="scaler" id="scaler"><div class="stage" id="stage"></div></div></div>

const APP="<!doctype html>\n<html lang=\"ko\">\n<head>\n<meta charset=\"utf-8\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<title>Tripback · 차량 화면 시안<\/title>\n<style>\n:root{\n  --navy:#002c5f;--teal:#007fa8;--cyan:#00aad2;--ink:#000;--utility:#444;--muted:#999;--dark:#1c1b1b;\n  --bg:#fff;--soft:#f3f5f7;--line:#d9dee3;--warn:#b25b00;--warnbg:#fff4e5;--ok:#007fa8;\n}\n*{box-sizing:border-box}\nhtml,body{margin:0}\nbody{background:var(--bg);color:var(--ink);font-family:'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',system-ui,sans-serif;font-size:16px;line-height:1.5;letter-spacing:-.4px;-webkit-font-smoothing:antialiased}\nbutton,input,textarea,select{font:inherit;letter-spacing:inherit;color:inherit}\nbutton{cursor:pointer;border:0;background:none;padding:0}\nbutton:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,summary:focus-visible{outline:2px solid #000;outline-offset:1px;border-color:var(--teal)}\n[hidden]{display:none!important}\np{margin:0}\n\n/* ---------- shell ---------- */\n.app{min-height:100vh;display:flex;flex-direction:column;max-width:1200px;margin:0 auto}\n.top{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px}\n.bar{display:flex;align-items:center;gap:10px;justify-content:space-between}\n.logo{display:flex;align-items:center;gap:8px;font-weight:500;font-size:15px;color:var(--navy)}\n.logo i{width:26px;height:26px;background:var(--navy);color:#fff;display:grid;place-items:center;font-style:normal;font-size:14px}\n.car{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}\n.chip{font-size:12px;font-weight:500;padding:4px 9px;border:1px solid var(--line);color:var(--utility);white-space:nowrap;background:#fff}\n.chip.on{color:var(--teal);border-color:var(--teal)}\n.chip.warn{color:var(--warn);border-color:var(--warn);background:var(--warnbg)}\n.phases{display:grid;grid-template-columns:repeat(3,1fr);margin-top:10px;border-top:1px solid var(--line)}\n.ph{padding:8px 4px 6px;text-align:center;font-size:13px;color:var(--muted);border-bottom:3px solid transparent;font-weight:500}\n.ph b{display:block;font-size:11px;font-weight:400}\n.ph.on{color:var(--navy);border-bottom-color:var(--teal)}\n.ph.done{color:var(--utility)}\n\n.body{flex:1;display:grid;gap:20px;padding:12px 16px 120px;grid-template-columns:1fr}\n.side{display:none}\n.main{min-width:0}\n@media(min-width:900px){\n  .body{grid-template-columns:minmax(0,1fr) 340px;padding-bottom:24px}\n  .body.solo{grid-template-columns:minmax(0,980px);justify-content:center}\n  .main{order:1}\n  .side{display:block;order:2;position:sticky;top:64px;align-self:start;max-height:calc(100vh - 76px);overflow:auto}\n  .body.nav{flex:none;grid-template-rows:minmax(0,1fr);height:calc(100vh - 106px);padding:10px 16px;align-items:stretch;overflow:hidden}\n  .body.nav .main{display:flex;flex-direction:column;min-height:0;overflow:hidden}\n  .body.nav .side{overflow-y:auto}\n  .body.nav .side{position:static;max-height:none;height:100%}\n  .inline-plan{display:none}\n  .actions{position:static!important;background:none!important;padding:0!important;margin-top:20px;border:0!important}\n}\n\nh1{font-size:clamp(26px,5.4vw,40px);font-weight:400;line-height:1.32;margin:8px 0 6px;letter-spacing:-.4px}\nh2{font-size:20px;font-weight:500;margin:0 0 4px}\nh3{font-size:16px;font-weight:500;margin:0 0 6px}\n.sub{color:var(--utility);font-size:14px}\n.card{background:#fff;border:1px solid var(--line);padding:16px;margin-top:14px}\n.card.soft{background:var(--soft);border-color:var(--soft)}\n.card.hl{border-color:var(--teal)}\n.card.warn{border-color:var(--warn);background:var(--warnbg)}\n.lbl{font-size:13px;font-weight:500;color:var(--ink);margin:18px 0 8px}\n.lbl small{font-weight:400;color:var(--utility)}\n.row{display:flex;gap:8px;flex-wrap:wrap}\n.opt{padding:0 14px;min-height:44px;background:#fff;border:1px solid var(--line);font-size:14px;font-weight:400;color:var(--ink);display:inline-flex;align-items:center;gap:6px}\n.opt[aria-pressed=true]{border-color:var(--teal);color:var(--teal);font-weight:500;box-shadow:inset 0 0 0 1px var(--teal)}\n.opt.sm{min-height:36px;padding:0 11px;font-size:13px}\n.sec{border-top:1px solid var(--line);margin-top:22px;padding-top:4px}\n.tinput{width:100%;background:#fff;border:1px solid var(--line);padding:12px;min-height:60px;font-size:16px;resize:none;border-radius:0}\n.time{display:flex;align-items:center;gap:8px;font-size:14px}\n.time input,select.sel{background:#fff;border:1px solid var(--line);padding:9px 10px;font-size:16px;min-height:44px;border-radius:0}\ndetails.more{border:1px solid var(--line);margin-top:18px}\ndetails.more>summary{list-style:none;cursor:pointer;padding:14px 16px;font-weight:500;display:flex;justify-content:space-between;align-items:center}\ndetails.more>summary::-webkit-details-marker{display:none}\ndetails.more>summary:after{content:'＋';color:var(--teal);font-size:18px}\ndetails.more[open]>summary:after{content:'－'}\ndetails.more .in{padding:0 16px 16px}\n\n.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;font-weight:500;font-size:16px;background:#fff;border:1px solid var(--navy);color:var(--navy)}\n.btn.pri{background:var(--navy);color:#fff}\n.btn.ghost{border-color:var(--line);color:var(--utility)}\n.btn.sm{min-height:38px;font-size:14px;padding:0 14px}\n.btn.block{width:100%}\n.actions{position:fixed;left:0;right:0;bottom:0;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line);z-index:15;display:flex;gap:10px;justify-content:center}\n.actions .btn{flex:1;max-width:520px}\n.actions .btn.ghost{flex:0 0 auto}\n.link{color:var(--navy);font-weight:500;font-size:14px;text-decoration:underline;text-underline-offset:3px}\n\n/* ---------- mic ---------- */\n.mic{width:60px;height:60px;border-radius:100%;background:var(--cyan);border:4px solid transparent;box-shadow:0 0 20px rgba(0,0,0,.15);display:grid;place-items:center;flex:none;color:#fff}\n.mic svg{width:26px;height:26px}\n.mic.lg{width:76px;height:76px}\n.mic.live{animation:pl 1.1s ease-in-out infinite}\n@keyframes pl{0%,100%{box-shadow:0 0 0 0 rgba(0,170,210,.5)}50%{box-shadow:0 0 0 14px rgba(0,170,210,0)}}\n.say{display:flex;gap:12px;align-items:flex-start}\n.say .tinput{flex:1}\n.ai{display:flex;gap:10px;align-items:flex-start;margin-top:12px;font-size:13px;color:var(--utility)}\n.tag{flex:none;font-size:11px;font-weight:500;color:#fff;background:var(--teal);padding:2px 7px}\n.mini{font-size:12px;padding:3px 8px;background:var(--soft);color:var(--ink)}\n\n/* ---------- generating ---------- */\n.gen{text-align:center;padding:60px 10px 20px}\n.spin{width:48px;height:48px;border-radius:50%;border:4px solid var(--soft);border-top-color:var(--teal);margin:0 auto 18px;animation:sp 1s linear infinite}\n@keyframes sp{to{transform:rotate(360deg)}}\n.steps{margin:22px auto 0;max-width:340px;text-align:left}\n.st{display:flex;align-items:center;gap:10px;padding:8px 0;color:var(--muted)}\n.st i{width:22px;height:22px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px}\n.st.on{color:var(--ink)}.st.on i{border-color:var(--teal);color:var(--teal)}\n.st.done i{background:var(--teal);border-color:var(--teal);color:#fff}.st.done{color:var(--utility)}\n\n/* ---------- plans ---------- */\n.plans{display:grid;gap:14px;margin-top:14px}\n@media(min-width:700px){.plans{grid-template-columns:1fr 1fr}}\n.plan{border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}\n.plan .head{display:flex;justify-content:space-between;align-items:center}\n.plan .name{font-size:20px;font-weight:500}\n.home{display:flex;justify-content:space-between;align-items:center;background:var(--soft);padding:10px 12px;font-size:13px;color:var(--utility)}\n.home b{color:var(--navy);font-size:22px;font-weight:500}\n.why{font-size:13px;color:var(--utility);border-left:3px solid var(--teal);padding-left:10px}\n.conds{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}\n\n/* ---------- timeline ---------- */\n.tl{list-style:none;margin:0;padding:0}\n.tl li{display:grid;grid-template-columns:48px 16px 1fr;gap:8px;padding-bottom:12px}\n.tl li:last-child{padding-bottom:0}\n.tl .t{font-size:13px;font-weight:500;color:var(--utility);text-align:right}\n.tl .d{position:relative}\n.tl .d:before{content:'';position:absolute;left:50%;top:5px;width:10px;height:10px;margin-left:-5px;border-radius:50%;background:#fff;border:2px solid var(--muted)}\n.tl .d:after{content:'';position:absolute;left:50%;top:17px;bottom:-12px;width:1px;background:var(--line)}\n.tl li:last-child .d:after{display:none}\n.tl .c{font-size:14px;font-weight:500}\n.tl .c small{display:block;font-weight:400;color:var(--utility);font-size:12px}\n.tl li.now .d:before{background:var(--teal);border-color:var(--teal);box-shadow:0 0 0 4px rgba(0,127,168,.2)}\n.tl li.now .c{color:var(--teal)}\n.tl li.past{opacity:.5}\n.tl li.tl-drive .c{font-weight:400;color:var(--utility);font-size:12px}\n.tl li.tl-drive .d:before{width:6px;height:6px;margin-left:-3px;top:8px;border-width:1px}\n.tl li.tl-home .d:before{background:var(--navy);border-color:var(--navy)}\n\n.pn{font-size:13px;font-weight:500;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center}\n\n/* ---------- navigation ---------- */\n.navcard{background:var(--navy);color:#fff;padding:14px 16px;display:flex;gap:14px;align-items:center}\n.navcard .ic{font-size:44px;line-height:1;width:56px;text-align:center}\n.navcard .dist{font-size:30px;font-weight:500;line-height:1.1}\n.navcard .road{font-size:14px;opacity:.9}\n.navcard .nx{font-size:12px;opacity:.75;margin-top:4px}\n.map{border:1px solid var(--line);border-top:0;background:#eef2f5;flex:1;min-height:0;overflow:hidden}\n.map svg{display:block;width:100%;height:100%}\n.mapfoot{display:flex;gap:0;border:1px solid var(--line);border-top:0}\n.mapfoot>div{flex:1;padding:10px 12px;border-right:1px solid var(--line)}\n.mapfoot>div:last-child{border-right:0}\n.mapfoot .k{font-size:11px;color:var(--utility)}\n.mapfoot .v{font-size:20px;font-weight:500;color:var(--navy);line-height:1.2}\n.mapfoot .v.a{color:var(--warn)}\n.traf{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;background:var(--soft);font-size:13px;margin-top:10px}\n.traf b{color:var(--navy)}\n.traf.slow{background:var(--warnbg)}.traf.slow b{color:var(--warn)}\n.dest h2{font-size:22px}\n.kv{display:grid;grid-template-columns:76px 1fr;gap:4px 10px;font-size:14px;margin-top:10px}\n.kv dt{color:var(--utility)}.kv dd{margin:0}\n.pk{border:1px solid var(--line);padding:12px;margin-top:10px;font-size:13px;color:var(--utility)}\n.pk b{color:var(--ink);font-weight:500}\n.kpis{display:grid;grid-template-columns:repeat(3,1fr);margin-top:14px;border:1px solid var(--line)}\n.kpi{padding:12px;border-right:1px solid var(--line)}\n.kpi:last-child{border-right:0}\n.kpi .k{font-size:11px;color:var(--utility)}\n.kpi .v{font-size:22px;font-weight:500;color:var(--navy);line-height:1.2}\n.kpi .v.a{color:var(--warn)}\n.kpi .s{font-size:11px;color:var(--utility)}\n\n/* ---------- arrival / stopwatch ---------- */\n.sw{text-align:center;padding:22px 10px;border:1px solid var(--line);margin-top:14px}\n.sw .big{font-size:clamp(46px,12vw,72px);font-weight:400;letter-spacing:-1px;font-variant-numeric:tabular-nums;color:var(--navy);line-height:1.1}\n.sw .k{font-size:13px;color:var(--utility)}\n.sw .pl{margin-top:8px;font-size:14px}\n.stepper{display:flex;align-items:center;justify-content:center;gap:12px;margin-top:14px}\n.stepper button{width:44px;height:44px;border:1px solid var(--navy);color:var(--navy);font-size:22px}\n.auto{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--utility);padding:12px 14px;background:var(--soft);margin-top:12px}\n.auto b{color:var(--navy)}\n.dwell{height:4px; /.exec(t||'');return m?(+m[1])*60+(+m[2]):fb};\nconst dur=m=>{m=Math.round(m);return m>=60?Math.floor(m/60)+'시간'+(m%60?' '+(m%60)+'분':''):m+'분'};\nconst hms=m=>{const s=Math.max(0,Math.floor(m*60));return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};\nconst SAFE=()=>S.form.safe;\nconst DEPART=()=>t2m(S.form.depart,510);\nconst HOME=()=>t2m(S.form.home,1110);\nfunction toast(msg){const t=$('#toast');t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3000)}\nconst isDriving=()=>S.screen==='drive'&&S.mode==='moving';\nfunction aiMode(){return S.set.voice==='auto'&&isDriving()&&Date.now()-S.touchAt>6000?'voice':'screen'}\nfunction speak(msg){if(aiMode()!=='voice')return false;try{const u=new SpeechSynthesisUtterance(msg);u.lang='ko-KR';speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}return true}\nfunction jo(w,a,b){const c=(w||'').trim().slice(-1).charCodeAt(0);if(c<0xAC00||c>0xD7A3)return w+b;return w+(((c-0xAC00)%28)?a:b)}\nconst aiChip=()=>`<span class=\"chip ${aiMode()==='voice'?'on':''}\" id=\"aiChip\">${aiMode()==='voice'?'🔊 AI 답변: 음성+화면':'🖥 AI 답변: 화면만'}<\/span>`;\nfunction bubbleHtml(){if(!S.reply)return '';return (S.voice?`<div class=\"bubble me\">“${esc(S.voice)}”<\/div>`:'')+`<div class=\"bubble\">${esc(S.reply.text)} <span class=\"mini\">${S.reply.voice?'🔊 음성+화면으로 답변':'화면으로만 답변'}<\/span><\/div>`}\nfunction smsText(){const d=new Date(),h=sched().home;return `[Tripback] 하윤님이 도착 예정 시각을 공유했습니다. ${d.getMonth()+1}월 ${d.getDate()}일 ${Math.floor(h/60)%24}시 ${Math.round(h%60)}분에 집에 도착할 예정이에요.`}\nfunction sendSms(){S.share={sent:true,at:m2t(S.now||DEPART()),eta:m2t(sched().home)};reply('등록된 가족에게 도착 예상 시각을 문자로 보냈어요.');toast('등록된 가족 1명에게 문자를 보냈어요')}\nfunction courses(){const set=SETS[S.form.region];return [{name:'가볍게 한 곳 + 카페',stops:[['전시·문화',set.culture,40],['카페',set.cafe,35]]},{name:'풍경 좋은 곳 한 곳',stops:[['사진 명소',set.photo,30]]}]}\nfunction courseStops(c){return c.stops.map((x,j)=>mkStop(x[0],x[1],12,x[2],true,'새로 추천한 코스',j+11,S.form.region))}\nfunction courseList(c){const l=lo();return S.stops.slice(0,l).concat(S.stops.slice(l).filter(x=>!x.opt||x.must),courseStops(c))}\nconst vehTxt=()=>S.form.vehicle==='ev'?'배터리':'연료';\nfunction pctPerMin(){return KMPM/RANGE[S.form.vehicle]*100}\n\n/* ---- stops ---- */\nconst INTRO={\n '체험':['주차 공간이 넓고 실내 놀이방이 있어 아이들과 방문하기 좋아요','체험이 짧게 나뉘어 있어 아이도 지루해하지 않아요'],\n '점심':['메뉴가 다양하고 아이 의자가 있어 가족 식사에 편해요','번호표 호출로 기다리는 동안 주변을 둘러볼 수 있어요'],\n '카페':['창가 자리에서 풍경이 보이고 주차가 편해요','디저트가 다양해 쉬었다 가기 좋아요'],\n '산책':['평탄한 길이라 아이와 걷기 좋아요','벤치가 많아 쉬엄쉬엄 걷기 좋아요'],\n '발견':['방문객이 적고 풍경이 좋아, 오늘 일정에서 가장 기억에 남을 만한 곳이에요','경로에서 가깝고 머무는 시간에 딱 맞아 골랐어요'],\n '전시·문화':['실내라 날씨와 상관없이 둘러보기 좋아요'],\n '온천·휴식':['운전 피로를 풀기 좋은 곳이에요'],\n '쇼핑':['시장 구경과 간식을 함께 즐길 수 있어요'],\n '사진 명소':['풍경이 좋아 사진 찍기 좋은 곳이에요'],\n '충전':['충전하는 동안 가까운 곳에서 쉴 수 있어요'],\n '주유':['경로 위에 있어 들르기 편해요'],\n '휴식':['화장실과 편의점이 가까워 쉬어 가기 좋아요'],\n '꼭 가는 곳':['직접 정하신 곳이라 일정의 중심에 고정했어요'],\n '경유':['직접 넣으신 곳이에요']};\nconst PROV={'서해안':'충남','동해안':'강원','남해안':'전남','호수·산':'충북','도심 근교':'경기'};\nconst POICAT={play:'체험',food:'식당',walk:'산책',cafe:'카페',culture:'전시',shop:'시장',spa:'온천',photo:'전망대',gem:'명소'};\nconst POIKIND={'식당':'식사','카페':'카페','체험':'체험','산책':'산책','전시':'전시·문화','시장':'쇼핑','온천':'온천·휴식','전망대':'사진 명소','명소':'발견','주유':'주유','충전':'충전','휴게소':'휴식','편의점':'휴식','관광지':'경유'};\nconst POIINTRO={'식당':'메뉴가 다양하고 가족 식사에 편해요','카페':'쉬었다 가기 좋은 곳이에요','체험':'아이와 함께 체험하기 좋아요','산책':'가볍게 걷기 좋은 길이에요','전시':'실내라 날씨와 상관없이 둘러보기 좋아요','시장':'구경과 간식을 함께 즐길 수 있어요','온천':'운전 피로를 풀기 좋아요','전망대':'풍경이 좋아 사진 찍기 좋아요','명소':'방문객이 적고 풍경이 좋은 곳이에요','주유':'경로 위에 있어 들르기 편해요','충전':'충전하는 동안 가까운 곳에서 쉴 수 있어요','휴게소':'화장실과 편의점이 가까워요'};\nlet _poi=null;\nfunction poiAll(){\n  if(_poi)return _poi;_poi=[];let n=0;\n  for(const r of Object.keys(SETS)){const set=SETS[r];\n    for(const k of Object.keys(POICAT)){n++;_poi.push({name:set[k],cat:POICAT[k],region:r,addr:`${PROV[r]} ${set.city} ${set.road} ${20+n*7}`,km:6+(n*7)%38})}\n    [['딸기 체험 농장','체험'],['바다마을 횟집','식당'],['시장 국밥집','식당'],['포구 로스터리','카페'],['등대 공원','관광지'],['바다 주유소','주유'],['급속충전소 (150kW)','충전'],['고속도로 휴게소','휴게소']].forEach(([nm,c])=>{n++;_poi.push({name:nm,cat:c,region:r,addr:`${PROV[r]} ${set.city} ${set.road} ${40+n*5}번길 ${n%9+1}`,km:4+(n*5)%30})});\n  }\n  return _poi;\n}\nfunction poiSearch(q){\n  q=(q||'').trim().toLowerCase();if(!q)return [];\n  const all=poiAll().filter(p=>p.name.toLowerCase().includes(q)||p.cat.includes(q)||p.addr.toLowerCase().includes(q));\n  all.sort((a,b)=>(b.region===S.form.region)-(a.region===S.form.region)||a.km-b.km);\n  return all.slice(0,6);\n}\nfunction psHtml(ctx,ph){return `<div class=\"ps\"><input class=\"tinput\" data-psq=\"1\" data-ctx=\"${ctx}\" autocomplete=\"off\" style=\"min-height:48px\" placeholder=\"${ph||'장소·주소 검색'}\"><div class=\"psr\"><\/div><\/div>`}\nfunction psList(){\n  if(!S.psRes.length)return `<p class=\"sub\" style=\"padding:10px 0\">검색어를 입력하면 길안내가 가능한 장소가 나와요.<\/p>`;\n  return S.psRes.map((p,i)=>`<button class=\"pr\" data-a=\"pick:${i}\"><span><b>${esc(p.name)}<\/b><small>${esc(p.cat)} · ${esc(p.addr)}<\/small><\/span><em>${p.km}km · 길안내 가능<\/em><\/button>`).join('');\n}\nfunction poiStop(p,kindOverride){\n  const kind=kindOverride||POIKIND[p.cat]||'경유';\n  const st=mkStop(kind,p.name,p.km>25?20:12,40,false,'직접 고른 장소',p.km,S.form.region);\n  st.addr=p.addr;st.intro=POIINTRO[p.cat]||'직접 고르신 곳이에요';st.user=true;st.must=true;return st;\n}\nfunction introFor(kind,seed){const a=INTRO[kind]||['동선에서 가깝고 머물기 편한 곳이에요'];return a[(seed||0)%a.length]}\nfunction mkStop(kind,name,travel,stay,opt,why,seed,region){\n  const set=SETS[region]||SETS['서해안'];\n  const fees=['무료','최초 30분 무료 · 이후 10분 500원','무료'];\n  const st=['여유','보통','여유','혼잡'];\n  return {kind,name,travel,stay,opt,why,delay:0,base:travel,arriveAct:null,leaveAct:null,traffic:null,intro:introFor(kind,seed),find:kind==='발견',must:false,\n    addr:`${set.city} ${set.road} ${100+seed*17}번길 ${seed*3+5}`,\n    parking:{name:`${name} 주차장`,fee:fees[seed%3],state:st[seed%4],walk:['도보 1분','도보 3분','도보 2분','도보 5분'][seed%4],tip:['입구 바로 앞 제1주차장','건물 뒤편 2번 게이트 방향','진입로 우측 주차장','본관 지하 1층']['0123'[seed%4]]}};\n}\nfunction buildPlan(id){\n  const f=S.form,n=SETS[f.region],stops=[];const dm=DISTMAP[f.dist];\n  const acts=['play','culture','spa','shop','photo'].filter(k=>f.interests.includes(k));\n  if(!acts.length)acts.push('play');\n  const a1=acts[0],a2=acts[1];\n  const kindName={play:'체험',culture:'전시·문화',spa:'온천·휴식',shop:'쇼핑',photo:'사진 명소'};\n  stops.push(mkStop(kindName[a1],n[a1],dm[0],120,false,'아이 컨디션이 좋은 오전에 배치',1,f.region));\n  stops.push(mkStop('점심',n.food,15,60,false,'활동 직후 식사',2,f.region));\n  if(id==='full'){\n    if(a2)stops.push(mkStop(kindName[a2],n[a2],15,60,true,'식후 두 번째 활동',3,f.region));\n    if(f.interests.includes('walk'))stops.push(mkStop('산책',n.walk,15,f.walk==='less'?40:65,true,'식후 가벼운 산책',4,f.region));\n    if(f.interests.includes('cafe'))stops.push(mkStop('카페',n.cafe,10,35,true,'귀가 전 마지막 휴식',5,f.region));\n  }else{\n    if(f.interests.includes('cafe'))stops.push(mkStop('카페',n.cafe,20,45,true,'여유 있게 쉬었다 출발',5,f.region));\n    else if(f.interests.includes('walk'))stops.push(mkStop('산책',n.walk,20,45,true,'식후 가벼운 산책',4,f.region));\n  }\n  const gem=n.gem;\n  if(id==='full'){const wi=stops.findIndex(x=>x.kind==='산책');if(wi>=0)stops[wi]=mkStop('발견',gem,15,60,true,'경로 인근에서 시간이 맞는 곳',6,f.region)}\n  else{const ci=stops.findIndex(x=>x.kind==='카페'||x.kind==='산책');stops.splice(ci<0?stops.length:ci,0,mkStop('발견',gem,12,35,true,'경로 인근에서 시간이 맞는 곳',6,f.region))}\n  const must=(f.must||'').trim();\n  if(must){\n    const maddr=f.mustAddr;\n    const food=/식당|횟집|국밥|밥집|맛집|한식|갈비|칼국수|냉면|면옥|쌈밥|족발|초밥|파스타|고기|국수|김밥|죽|집$/.test(must);\n    const li=stops.findIndex(x=>x.kind==='점심');\n    if(food&&li>=0){const x=stops[li];x.name=must;x.must=true;x.opt=false;x.why='꼭 가고 싶은 곳으로 고정';x.intro='직접 정하신 식당이라 점심 시간에 고정했어요';if(maddr)x.addr=maddr}\n    else{const x=mkStop('꼭 가는 곳',must,15,50,false,'꼭 가고 싶은 곳으로 고정',8,f.region);x.must=true;if(maddr)x.addr=maddr;stops.splice(1,0,x)}\n  }\n  return stops;\n}\n/* 실제 기록(actual)이 있으면 그 값을, 없으면 계획값을 사용 */\nfunction schedule(stops,depart,homeTravel){\n  let t=depart;const rows=[];\n  stops.forEach((s,i)=>{\n    const arrive=s.arriveAct!=null?s.arriveAct:t+s.travel;\n    const tot=s.stay+s.delay;\n    let leave;\n    if(s.leaveAct!=null)leave=s.leaveAct;\n    else if(S.screen==='stay'&&stops[S.idx]===s)leave=Math.max(arrive+tot,S.now);\n    else leave=arrive+tot;\n    rows.push({s,arrive,leave});t=leave;\n  });\n  return {rows,home:t+homeTravel,lastLeave:t};\n}\nconst sched=()=>schedule(S.stops,DEPART(),S.homeTravel);\nconst margin=()=>Math.round(HOME()-sched().home);\nfunction futureOpt(){ // 남은 선택 방문지 중 마지막(현재 도착 중인 곳 제외)\n  for(let i=S.stops.length-1;i>S.idx;i--)if(S.stops[i].opt)return i;\n  return -1;\n}\n/* ---- energy ---- */\nfunction predictEnd(){\n  let c=S.energyStart;const p=pctPerMin();\n  S.stops.forEach(s=>{c-=s.travel*p;if(s.kind==='충전')c=Math.min(80,c+s.stay*1.2);if(s.kind==='주유')c=90});\n  return c-S.homeTravel*p;\n}\nfunction energyKm(){return Math.round(Math.max(0,S.energy)/100*RANGE[S.form.vehicle])}\n\n/* ---- speech parse (시연용 AI 이해) ---- */\nfunction parseText(txt){\n  const f=S.form,out=[];\n  if(/아이|애기|아들|딸/.test(txt)){f.who='family';out.push('아이와');\n    if(/유치원|영유아|아기|애기|돌|두 살|세 살|네 살/.test(txt)){f.kid='baby';out.push('영유아')}else if(/중학|고등|청소년/.test(txt)){f.kid='teen';out.push('청소년')}else if(/초등|[6-9]\\s*살|1[0-2]\\s*살/.test(txt)){f.kid='elem';out.push('초등학생')}}\n  else if(/남편|아내|여친|남친|둘이|커플|부부|신랑|신부/.test(txt)){f.who='couple';out.push('둘이서')}\n  else if(/친구/.test(txt)){f.who='friends';out.push('친구와')}\n  else if(/부모님|엄마|아빠|어머니|아버지|어르신/.test(txt)){f.who='parents';out.push('부모님과')}\n  else if(/혼자/.test(txt)){f.who='solo';out.push('혼자')}\n  if(/강아지|반려견|댕댕|멍멍/.test(txt)){if(!f.amen.includes('pet'))f.amen.push('pet');out.push('반려견 동반')}\n  const ints=[];\n  [['play',/체험/],['food',/맛집|점심|먹|식당/],['walk',/산책|자연|걷기\\s*(좋|많)/],['cafe',/카페|커피/],['culture',/전시|박물관|미술/],['shop',/시장|쇼핑/],['spa',/온천|휴식|쉬/],['photo',/사진|포토|전망/]].forEach(([k,re])=>{if(re.test(txt))ints.push(k)});\n  if(ints.length){f.interests=ints;out.push(ints.map(k=>INT[k]).join('·'))}\n  for(const m of txt.matchAll(/(\\d{1,2})\\s*시\\s*(반|\\d{1,2}\\s*분)?\\s*(에|까지)?\\s*(출발)?/g)){\n    let h=+m[1];const mm=m[2]==='반'?30:(m[2]?parseInt(m[2]):0);\n    if(h>=24)continue;\n    if(m[4]){f.depart=String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');out.push(f.depart+' 출발')}\n    else{if(h<=11)h+=12;f.home=String(h).padStart(2,'0')+':'+String(mm).padStart(2,'0');out.push(f.home+'까지 귀가')}\n  }\n  const dm=txt.match(/([1-3])\\s*시간\\s*(이내|안)/);if(dm){f.dist=+dm[1];out.push(DIST[f.dist])}\n  if(/비\\s*(오|올|와)/.test(txt)){f.rain=true;out.push('비 오면 실내')}\n  if(/걷기\\s*(는\\s*)?(싫|적|안)|많이\\s*걷기\\s*싫|안\\s*걷/.test(txt)){f.walk='less';out.push('걷기 적게')}\n  const bm=txt.match(/(\\d)\\s*만\\s*원/);if(bm){const v=+bm[1];f.budget=v<=3?'low':v<=5?'mid':v<=10?'high':'any';out.push(BUDGET[f.budget])}\n  for(const r of Object.keys(SETS)){if(txt.includes(r.split('·')[0])){f.region=r;out.push(r)}}\n  return out;\n}\nconst EXAMPLE='아이랑 체험하고 맛집도 가고 싶어. 카페도 들르고 싶고, 8시 반에 출발해서 6시 반까지는 집에 도착했으면 해. 걷기는 적게 하고 싶어';\n\n/* ================= leg / traffic ================= */\nconst TRAFFIC={'산책':5,'카페':0,'점심':0,'주유':3,'충전':3,'휴식':2,'default':2};\nfunction trafficFor(idx){\n  if(idx>=S.stops.length)return 10;\n  const k=S.stops[idx].kind;return k in TRAFFIC?TRAFFIC[k]:(idx===0?0:TRAFFIC.default);\n}\nfunction beginLeg(idx){\n  const toHome=idx>=S.stops.length;\n  const baseMin=toHome?S.homeTravel:S.stops[idx].travel;\n  const extra=idx===0?0:trafficFor(idx);\n  if(toHome)S.homeTravel+=extra;else{S.stops[idx].travel+=extra;S.stops[idx].extra=extra}\n  const level=extra===0?'원활':extra<=6?'서행':'정체';\n  S.idx=idx;S.ign=false;S.mode='moving';\n  S.now=Math.round(S.now);S.leg={idx,start:S.now,dur:baseMin+extra,base:baseMin,extra,level,arrivedAt:null,km:Math.round(baseMin*KMPM)};\n  S.maxLeg=Math.max(S.maxLeg,S.leg.dur);\n  S.screen='drive';S.car='driving';S.endNotified=false;\n  S.notes=extra?[`현재 교통 반영: 예상 ${dur(baseMin)} → ${dur(baseMin+extra)} (${level}, +${extra}분)`]:[`현재 교통 반영: 예상 ${dur(baseMin)} (원활)`];\n  checkPending();\n}\nfunction checkPending(){\n  if(S.pending)return;\n  const m=margin();\n  if(m>=SAFE())return;\n  if(S.ackMargin!=null&&m>=S.ackMargin-9)return;\n  if(futureOpt()>=0){S.pending={left:m};const st=S.stops[futureOpt()];S.voice=null;reply(`귀가가 ${m2t(sched().home)}로 늦어질 수 있어요. ${st.kind}을 빼거나 줄이는 안을 화면에 띄웠어요.`)}\n}\n\n/* ================= actions ================= */\nconst A={\n  region(v){S.form.region=v;render()},\n  who(v){S.form.who=v;render()},\n  kid(v){S.form.kid=v;render()},\n  int(v){const a=S.form.interests,i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);render()},\n  tog(arg){const [k,v]=arg.split('|');const a=S.form[k];const i=a.indexOf(v);i>=0?a.splice(i,1):a.push(v);render()},\n  set(arg){const [k,v]=arg.split('|');S.form[k]=isNaN(+v)||k==='vehicle'||k==='budget'||k==='walk'?v:+v;render()},\n  flag(k){S.form[k]=!S.form[k];render()},\n  time(el){const k=el.dataset.k;const v=el.value;if(/^\\d{1,2}:\\d{2}$/.test(v)){S.form[k]=v}else{el.value=S.form[k];toast('시간을 선택해 주세요')}},\n  say(){syncText();S.ai=parseText(S.form.text);render();if(S.ai.length)toast('말씀하신 내용을 조건으로 바꿨어요')},\n  example(){S.form.text=EXAMPLE;S.ai=parseText(EXAMPLE);render()},\n  mic(){listen()},\n  generate(){\n    syncText();\n    if(HOME()<=DEPART()+120){toast('귀가 시각을 출발보다 2시간 이상 뒤로 정해 주세요');return}\n    S.homeTravel=DISTMAP[S.form.dist][1];\n    S.energyStart=START[S.form.vehicle];S.energy=S.energyStart;\n    S.screen='gen';S.genStep=0;render();\n    [600,1300,2000].forEach((d,i)=>setTimeout(()=>{if(S.screen!=='gen')return;S.genStep=i+1;if(i===2)S.screen='choose';render()},d));\n  },\n  choose(id){S.dis={};S.planId=id;S.stops=buildPlan(id);S.idx=0;S.pending=null;S.ackMargin=null;S.adjusted=false;S.screen='detail';render();scrollTo(0,0)},\n  toChoose(){S.screen='choose';render()},\n  back(){\n    const sc=S.screen;\n    if(sc==='gen'||sc==='choose'||sc==='summary'){S.screen='start';S.tab='home'}\n    else if(sc==='detail')S.screen='choose';\n    else if(sc==='drive'||sc==='stay'){S.sheet='leave';renderSheet();return}\n    else if(sc==='start'&&S.tab!=='home')S.tab='home';\n    else return;\n    render();scrollTo(0,0)\n  },\n  goHome(){if(S.screen==='drive'||S.screen==='stay'){S.sheet='leave';renderSheet();return}if(S.screen==='start'&&S.tab==='home')return;S.screen='start';S.tab='home';render();scrollTo(0,0)},\n  tab(k){S.tab=k;S.screen='start';render()},\n  leaveGo(){stopTick();S.screen='start';S.tab='home';S.sheet=null;S.car='parked';renderSheet();render();toast('여행을 종료하고 홈으로 왔어요')},\n  dismiss(k){S.dis[k]=true;render()},\n  mustClear(){S.form.must='';S.form.mustAddr='';render()},\n  setvoice(v){S.set.voice=v;render()},\n  place(i){S.sheet='place';S.placeIdx=+i;renderSheet()},\n  swap2(i){S.sheet='edit';S.swapIdx=+i;renderSheet()},\n  rm2(i){S.stops.splice(+i,1);S.adjusted=true;S.sheet=null;afterEdit()},\n  swapCancel(){S.swapIdx=null;S.psRes=[];renderSheet()},\n  pick(i){\n    const p=S.psRes[+i];if(!p)return;const ctx=S.psCtx;S.psRes=[];\n    if(ctx==='must'){S.form.must=p.name;S.form.mustAddr=p.addr;render()}\n    else if(ctx==='swap'){replaceStop(S.swapIdx,p.name,'직접 고른 장소',POIINTRO[p.cat],p.addr);S.swapIdx=null;S.adjusted=true;afterEdit()}\n    else if(ctx==='add'){const pos=+(($('#addPos')||{}).value||lo());insertStop({kind:POIKIND[p.cat]||'경유',name:p.name,detour:p.km>25?12:8,stay:40,intro:POIINTRO[p.cat],addr:p.addr},pos,false);S.adjusted=true;afterEdit()}\n    else if(ctx==='navq'){insertPoi(p,isDriving());S.sheet=null;S.adjusted=true;checkPending();reply(`${jo(p.name,'을','를')} 다음 경유지로 넣고 길안내를 이어가요. 집 도착 예상은 ${m2t(sched().home)}로 바뀌었어요.`);afterEdit()}\n  },\n  go(){\n    S.now=DEPART();S.delayDone=false;S.log=[];S.maxLeg=0;S.energy=S.energyStart;\n    S.stops.forEach(s=>{s.arriveAct=null;s.leaveAct=null;s.delay=0});\n    beginLeg(0);startTick();render();scrollTo(0,0);\n    toast('첫 구간을 내비게이션에 전달했어요');\n  },\n  /* GPS 도착 → 5분 이상 머무르면 자동, 또는 즉시 확인 */\n  park(){confirmStay(false)},\n  keepMoving(){S.leg.dur+=5;S.mode='moving';S.leg.arrivedAt=null;render()},\n  ignite(){ // 시동 감지(시연) → 출발 버튼 표시\n    if(S.screen!=='stay')return;\n    S.ign=true;render();toast('시동을 감지했어요 · ‘출발’ 버튼을 눌러 주세요');\n  },\n  depart(v){\n    if(S.screen!=='stay')return;\n    const st=S.stops[S.idx];st.leaveAct=Math.round(S.now);\n    if(st.kind==='충전')S.energy=Math.min(80,S.energy+st.stay*1.2);\n    if(st.kind==='주유')S.energy=90;\n    beginLeg(S.idx+1);render();scrollTo(0,0);\n    toast(v==='auto'?'100m 이상 움직여 자동으로 출발 처리했어요 · 현재 교통을 반영해 안내합니다':'출발했어요 · 현재 교통을 반영해 다음 구간을 안내합니다');\n  },\n  spd(v){S.speed=+v;render()},\n  skipLeg(){if(S.screen==='drive'&&S.mode==='moving'){const rest=S.leg.start+S.leg.dur-S.now;if(rest>0)S.energy-=rest*pctPerMin();S.now=S.leg.start+S.leg.dur;tick(true)}},\n  skipStay(){if(S.screen==='stay'){const st=S.stops[S.idx];S.now=Math.max(S.now,st.arriveAct+st.stay+st.delay);tick(true);render()}},\n  skipDwell(){if(S.mode==='arrived'){S.now=S.leg.arrivedAt+5;tick(true)}},\n  adj(d){const st=S.stops[S.idx];st.stay=Math.max(10,st.stay+(+d));S.adjusted=true;render()},\n  apply(opt){\n    const i=futureOpt();if(i<0)return;const st=S.stops[i];\n    if(opt==='drop'){const r=S.stops.splice(i,1)[0];if(S.stops[i])S.stops[i].travel+=Math.round(r.travel*.5);S.voice=r.kind+' 빼줘'}\n    else{st.stay=Math.max(10,st.stay-20);S.voice=st.kind+' 시간 줄여줘'}\n    S.pending=null;S.ackMargin=null;S.adjusted=true;\n    render();toast('적용했어요 · 귀가 예상 '+m2t(sched().home));\n  },\n  keep(){S.ackMargin=margin();S.pending=null;render();toast('일정을 그대로 유지합니다')},\n  voice(k){voiceCmd(k)},\n  open(k){S.sheet=k;S.editCat=null;S.swapIdx=null;S.psRes=[];renderSheet()},\n  close(){S.sheet=null;S.swapIdx=null;renderSheet()},\n  cat(k){S.editCat=k;S.swapIdx=null;renderSheet()},\n  swap(i){S.swapIdx=+i;renderSheet()},\n  swapTo(k){const s=S.stops[S.swapIdx],c=candidates(swapCat(s.kind))[+k];if(!c)return;replaceStop(S.swapIdx,c.name,'직접 고른 장소',introFor(s.kind,+k+3));S.swapIdx=null;S.adjusted=true;afterEdit()},\n  applyc(k){const c=courses()[+k];S.stops=courseList(c);S.adjusted=true;S.sheet=null;S.pending=null;S.ackMargin=null;checkPending();reply(`새 코스로 바꿨어요. 집 도착 예상은 ${m2t(sched().home)}로 바뀌었어요.`);renderSheet();render();toast('새 코스로 바꿨어요 · 귀가 예상 '+m2t(sched().home))},\n  mv(arg){const [i,d]=arg.split('|').map(Number);const a=S.stops;const j=i+d;if(j<lo()||j>=a.length)return;[a[i],a[j]]=[a[j],a[i]];S.adjusted=true;afterEdit()},\n  rm(i){S.stops.splice(+i,1);S.adjusted=true;afterEdit()},\n  sst(arg){const [i,d]=arg.split('|').map(Number);const s=S.stops[i];s.stay=Math.max(10,s.stay+d);S.adjusted=true;afterEdit()},\n  addc(arg){const [cat,k]=arg.split('|');const pos=+($('#addPos')||{value:lo()}).value;addStop(cat,+k,pos);afterEdit()},\n  saveFam(){S.set.family=($('#famNum')||{}).value||S.set.family;toast('가족 연락처를 저장했어요')},\n  recGas(){addService()},\n  recRest(){addRest()},\n  send(){sendSms();renderSheet();render()},\n  home(){summary()},\n  reuse(id){loadTrip(id,'same')},\n  reuseCond(id){loadTrip(id,'cond')},\n  openTrip(id){S.tripView=id;S.sheet='trip';renderSheet()},\n  delTrip(id){S.history=S.history.filter(h=>h.id!==id);persist();renderSheet();render()},\n  restart(){S.savedId=null;stopTick();const keep=S.form;Object.assign(S,{screen:'start',ai:null,planId:null,stops:[],idx:0,pending:null,ackMargin:null,delayDone:false,log:[],voice:null,sheet:null,adjusted:false,notes:[],mode:'moving',leg:null,share:{sent:false,at:null,eta:null},ign:false,reply:null,swapIdx:null,tab:'home',dis:{},psRes:[]});S.form=keep;renderSheet();render();scrollTo(0,0)}\n};\ndocument.addEventListener('click',e=>{\n  const b=e.target.closest('[data-a]');if(!b)return;\n  const i=b.dataset.a.indexOf(':');const n=i<0?b.dataset.a:b.dataset.a.slice(0,i),v=i<0?undefined:b.dataset.a.slice(i+1);\n  if(A[n])A[n](v);\n});\ndocument.addEventListener('change',e=>{const t=e.target.closest('input[data-k]');if(t)A.time(t)});\ndocument.addEventListener('toggle',e=>{if(e.target.classList&&e.target.classList.contains('more'))S.more=e.target.open},true);\ndocument.addEventListener('input',e=>{if(e.target.id==='sayText')S.form.text=e.target.value;\n  if(e.target.dataset&&e.target.dataset.psq){S.psCtx=e.target.dataset.ctx;S.psRes=poiSearch(e.target.value);const r=e.target.parentNode.querySelector('.psr');if(r)r.innerHTML=S.psRes.length||e.target.value.trim()?(S.psRes.length?psList():'<p class=\"sub\" style=\"padding:10px 0\">검색 결과가 없어요. 다른 이름이나 주소로 찾아 보세요.<\/p>'):''}\n  if(e.target.id==='famNum'){S.set.family=e.target.value}});\ndocument.addEventListener('pointerdown',e=>{if(!e.target.closest('.voice-sim'))S.touchAt=Date.now()},true);\nfunction syncText(){const el=$('#sayText');if(el)S.form.text=el.value}\n\n/* ---- 길게 눌러 순서 바꾸기 ---- */\nlet DRAG=null;\ndocument.addEventListener('pointerdown',e=>{\n  const g=e.target.closest('.grip');if(!g)return;const row=g.closest('.erow');if(!row||row.classList.contains('lock'))return;\n  DRAG={i:+g.dataset.i,row,y0:e.clientY,on:false,t:setTimeout(()=>{if(DRAG){DRAG.on=true;row.classList.add('lift')}},180)};\n  try{g.setPointerCapture(e.pointerId)}catch(x){}\n});\ndocument.addEventListener('pointermove',e=>{if(DRAG&&DRAG.on)DRAG.row.style.transform='translateY('+(e.clientY-DRAG.y0)+'px)'});\nfunction endDrag(e,cancel){\n  if(!DRAG)return;clearTimeout(DRAG.t);const d=DRAG;DRAG=null;\n  if(d.on&&!cancel){\n    d.row.style.transform='';\n    const rows=[...document.querySelectorAll('.erow')];let to=rows.findIndex(r=>e.clientY<r.getBoundingClientRect().top+r.getBoundingClientRect().height/2);\n    if(to<0)to=rows.length;if(to>d.i)to--;to=Math.max(lo(),Math.min(S.stops.length-1,to));\n    if(to!==d.i){const [x]=S.stops.splice(d.i,1);S.stops.splice(to,0,x);S.adjusted=true;afterEdit();return}\n  }\n  d.row.style.transform='';d.row.classList.remove('lift');\n}\ndocument.addEventListener('pointerup',e=>endDrag(e,false));\ndocument.addEventListener('pointercancel',e=>endDrag(e,true));\n/* ---- speech ---- */\nfunction listen(){\n  if(S.listening)return;\n  const SR=window.SpeechRecognition||window.webkitSpeechRecognition;\n  S.listening=true;render();\n  const fallback=()=>{let i=0;const t=EXAMPLE;S.form.text='';const h=setInterval(()=>{i+=2;S.form.text=t.slice(0,i);const el=$('#sayText');if(el)el.value=S.form.text;if(i>=t.length){clearInterval(h);S.listening=false;S.ai=parseText(S.form.text);render()}},45)};\n  if(SR){try{const r=new SR();r.lang='ko-KR';r.interimResults=true;r.continuous=false;\n    r.onresult=e=>{let t='';for(const x of e.results)t+=x[0].transcript;S.form.text=t;const el=$('#sayText');if(el)el.value=t};\n    r.onerror=()=>{if(S.listening){fallback()}};\n    r.onend=()=>{if(S.listening&&S.form.text){S.listening=false;S.ai=parseText(S.form.text);render()}else if(S.listening){S.listening=false;render()}};\n    r.start();setTimeout(()=>{if(S.listening&&!S.form.text){try{r.abort()}catch(e){}fallback()}},6000);return}catch(e){}}\n  fallback();\n}\n\n/* ---- tick (시연용 가상 시계) ---- */\nfunction startTick(){stopTick();S.tick=setInterval(()=>{if(S.speed>0){S.now+=S.speed*.25;tick(false)}},250)}\nfunction stopTick(){if(S.tick){clearInterval(S.tick);S.tick=null}}\nfunction tick(force){\n  if(S.screen==='drive'){\n    if(S.mode==='moving'){\n      const p=(S.now-S.leg.start)/S.leg.dur;\n      S.energy-=S.speed*.25*pctPerMin()*(force?0:1);\n      if(p>=1){S.now=Math.round(S.leg.start+S.leg.dur);S.mode='arrived';S.now=Math.round(S.now);S.leg.arrivedAt=S.now;\n        const toHome=S.leg.idx>=S.stops.length;\n        render();toast(toHome?'📍 집 근처에 도착했어요':'📍 목적지에 도착한 것을 GPS로 확인했어요');return}\n    }else if(S.mode==='arrived'){\n      if(S.now-S.leg.arrivedAt>=5){confirmStay(true);return}\n    }\n    updateLive();\n  }else if(S.screen==='stay'){\n    const st=S.stops[S.idx];\n    if(!S.endNotified&&S.now>=st.arriveAct+st.stay+st.delay){S.endNotified=true;toast('예정한 시간이 지났어요 · 출발 준비를 해 주세요')}\n    updateLive();\n  }\n}\nfunction confirmStay(auto){\n  const toHome=S.leg.idx>=S.stops.length;\n  if(toHome){summary();toast('집 도착을 기록했어요');return}\n  const st=S.stops[S.idx];\n  st.arriveAct=S.leg.arrivedAt;st.autoArr=!!auto;S.ign=false;S.screen='stay';S.car='parked';S.endNotified=false;\n  S.log.push({name:st.name,at:st.arriveAct});\n  if(st.kind==='점심'&&!S.delayDone){st.delay=25;S.delayDone=true;S.notes=['식사 대기로 25분 지연됐어요'];}\n  else S.notes=[];\n  checkPending();\n  render();scrollTo(0,0);\n  toast(auto?'5분이 지나 도착으로 자동 기록했어요':'도착을 기록했어요');\n}\nfunction summary(){stopTick();S.screen='summary';S.car='parked';saveTrip();render();scrollTo(0,0)}\n/* ---- 내 여행 (지난 여정) ---- */\nconst HK='rdp_history_v1';\nfunction loadHist(){try{const h=JSON.parse(localStorage.getItem(HK)||'null');if(Array.isArray(h))return h}catch(e){}return null}\nfunction persist(){try{localStorage.setItem(HK,JSON.stringify(S.history.filter(h=>!h.seed)))}catch(e){}}\nfunction snapStops(stops){return stops.map(s=>({intro:s.intro,find:s.find,must:s.must,kind:s.kind,name:s.name,travel:Math.max(5,s.travel-(s.extra||0)),stay:s.stay,opt:s.opt,why:s.why,addr:s.addr,parking:s.parking,user:!!s.user}))}\nfunction dateLabel(d){return (d.getMonth()+1)+'월 '+d.getDate()+'일'}\nfunction seedTrips(){\n  const out=[];\n  [['동해안','easy',new Date(Date.now()-6*864e5),'family',88],['호수·산','full',new Date(Date.now()-20*864e5),'couple',76]].forEach(([region,pid,d,who,score],i)=>{\n    const keep=S.form;S.form={...DEF(),region,who};const stops=buildPlan(pid);const home=schedule(stops,DEPART(),DISTMAP[2][1]).home;S.form=keep;\n    out.push({id:'seed'+i,seed:true,date:dateLabel(d),region,planId:pid,form:{...DEF(),region,who},stops:snapStops(stops),homeTravel:DISTMAP[2][1],homeAt:m2t(home),score,margin:HOME()-home});\n  });\n  return out;\n}\nfunction saveTrip(){\n  if(S.savedId)return;\n  const sc=scoreCalc();const id='t'
